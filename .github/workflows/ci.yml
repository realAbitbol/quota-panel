name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Docker registry paths must be lowercase. Deriving the owner from
# github.repository emits "realAbitbol", which fails the registry name grammar
# and makes the push die with "denied: permission_denied: read_package".
env:
  IMAGE: ghcr.io/realabitbol/quota-panel

# Least privilege by default: the `test` job runs third-party action code before anything is
# published, and it used to inherit whatever the repository default was — while the job that
# actually needs a token was the only one scoped. The `docker` job re-declares its own.
permissions:
  contents: read

# Two pushes to main can overlap, and an older build finishing last would publish itself as
# :latest. A newer push on the same ref now cancels the older run instead.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every action is pinned to the commit SHA of the tag named in its comment, not to the tag: a
# re-pointed or compromised tag would execute inside a job that can push to GHCR, which is the
# sharpest edge in a project whose whole point is credential hygiene. These are the same majors
# the workflow already used, so nothing about a run changes; bump the SHA and its comment
# together. Resolve one with:
#   curl -s https://api.github.com/repos/OWNER/REPO/git/ref/tags/TAG | jq -r .object.sha
jobs:
  test:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile app.py history.py providers_balance.py tests/smoke.py tests/background.py tests/balance.py tests/history.py tests/screenshot.py tests/cadence_soak.py tests/tab_switch.py

      - name: Validate the example config
        run: |
          python - <<'PY'
          import json, os, sys
          sys.path.insert(0, ".")
          from app import PROVIDERS
          cfg = json.load(open("accounts.example.json"))
          assert isinstance(cfg["accounts"], list) and cfg["accounts"], "empty accounts list"
          ids = [a["id"] for a in cfg["accounts"]]
          assert len(set(ids)) == len(ids), "duplicate ids in accounts.example.json: %s" % ids
          for a in cfg["accounts"]:
              assert a["provider"] in PROVIDERS, "%s is not a registered provider" % a["provider"]
              # Every example account must resolve a mark that is actually on disk, or a
              # public screenshot ships with an empty icon box.
              logo = os.path.join("static", "logos", PROVIDERS[a["provider"]]["logo"])
              assert os.path.exists(logo), "missing logo for %s: %s" % (a["provider"], logo)
          b = cfg.get("background_url")
          assert b is None or (isinstance(b, str) and (b == "" or b.startswith(("http://", "https://")))), b
          # The example must ship the history layer ON and consistent: it is the file the
          # README tells a reader to copy, and its store needs a mounted directory (the
          # compose example has one). A missing or misspelled key here would ship an example
          # that silently keeps no history.
          import history
          history_config, history_notes = history.load_config("accounts.example.json", env={})
          assert history_config["enabled"] is True, history_config
          assert not history_notes, history_notes
          print("example config OK: %d accounts, ids %s, background_url %r, history %s"
                % (len(ids), ids, b, "on"))
          PY

      - name: Smoke test the HTTP surface
        run: python tests/smoke.py

      - name: History layer (opt-in storage, retention, HTTP contract)
        # The layer is off by default, so nothing else would exercise it: this is what keeps
        # the storage contract, the prune guard and the "no database while it is off" promise
        # honest.
        run: python tests/history.py

      - name: Balance providers, registry and icons
        run: python tests/balance.py

      - name: Screenshot harness (real render, real Chromium)
        id: browser
        # py_compile only proved the harness parses. The DOM contract it depends on
        # (.card, .bal-amount, .pill, img.mark) is checked by nothing, so a CSS rename was
        # invisible until someone next shot the README image — and a missing browser printed
        # a skip and *succeeded*. Actions sets CI=true, which makes that absence a failure.
        env:
          SCREENSHOT_OUT: /tmp/quota-panel-screenshot.png
          SCREENSHOT_HISTORY_OUT: /tmp/quota-panel-history.png
        run: |
          SCREENSHOT_BROWSER="$(command -v google-chrome || command -v google-chrome-stable \
            || command -v chromium || command -v chromium-browser || true)"
          export SCREENSHOT_BROWSER
          echo "browser: ${SCREENSHOT_BROWSER:-<none found>}"
          echo "path=$SCREENSHOT_BROWSER" >> "$GITHUB_OUTPUT"
          python tests/screenshot.py

      - name: Countdown soak (must not decay)
        # The screenshot harness samples the countdown twice, which cannot see a counter that
        # re-arms at a shrinking interval over time -- the actual reported bug. This watches it
        # across several full cycles at a 10s cadence and requires every cycle to re-arm at one
        # cadence. Verified to FAIL on the old stamp-alignment scheduling and pass on the current
        # one; a check that cannot fail is not a check.
        env:
          SCREENSHOT_BROWSER: ${{ steps.browser.outputs.path }}
          QUOTA_POLL_SECONDS: "10"
          # Long enough for at least two full re-arms: with one cycle the soak cannot see a
          # shrinking interval, which is the whole point of watching it.
          SOAK_SECONDS: "34"
        run: python tests/cadence_soak.py

      - name: Tab-switch behaviour (must keep refreshing)
        # The reported risk: a burst of tab switches while a request is in flight can leave the
        # refresh timer unarmed, and a throttled background tab then shows numbers minutes old.
        # Drives a real page through real visibility transitions.
        env:
          SCREENSHOT_BROWSER: ${{ steps.browser.outputs.path }}
          QUOTA_POLL_SECONDS: "10"
        run: python tests/tab_switch.py

      - name: Background image shrink (Pillow)
        run: |
          # Pinned and matching the Dockerfile: this script asserts exact re-encoded
          # dimensions and byte sizes, so a Pillow major must not arrive unannounced.
          pip install --quiet pillow==12.3.0
          python tests/background.py

  docker:
    name: build and push image
    runs-on: ubuntu-latest
    needs: test
    # Build on every PR so a broken Dockerfile is caught before merge; push only
    # from the default branch and from tags.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1  # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069  # v4.4.1

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f  # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302  # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc  # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
