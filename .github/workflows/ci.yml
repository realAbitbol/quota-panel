name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Docker registry paths must be lowercase. Deriving the owner from
# github.repository emits "realAbitbol", which fails the registry name grammar
# and makes the push die with "denied: permission_denied: read_package".
env:
  IMAGE: ghcr.io/realabitbol/quota-panel

jobs:
  test:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile
        run: python -m py_compile app.py tests/smoke.py

      - name: Validate the example config
        run: |
          python - <<'PY'
          import json
          cfg = json.load(open("accounts.example.json"))
          assert isinstance(cfg["accounts"], list) and cfg["accounts"], "empty accounts list"
          ids = [a["id"] for a in cfg["accounts"]]
          assert len(set(ids)) == len(ids), "duplicate ids in accounts.example.json: %s" % ids
          for a in cfg["accounts"]:
              assert a["provider"] in ("commandcode", "opencode_go"), a
          print("example config OK: %d accounts, ids %s" % (len(ids), ids))
          PY

      - name: Smoke test the HTTP surface
        run: python tests/smoke.py

  docker:
    name: build and push image
    runs-on: ubuntu-latest
    needs: test
    # Build on every PR so a broken Dockerfile is caught before merge; push only
    # from the default branch and from tags.
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: true
          sbom: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
