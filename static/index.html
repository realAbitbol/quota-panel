<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Cache-Control is set by the server on every response, including index.html. The
     `http-equiv="Cache-Control"` pragma that used to sit here is not in the HTML spec's
     pragma list, so it did nothing; the real header is what keeps the UI from going stale. -->
<link rel="icon" href="/static/favicon.ico" sizes="32x32">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/favicon.svg">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Read-only quota and credit dashboard for your AI provider keys and subscriptions: percent windows, money balances, no writes.">
<title>Quota Panel</title>
<style>
  :root{
    --bg:#0b0d12; --card:20,24,33; --card-2:#1b2130; --line:#252c3b;
    --fg:#e8ecf5; --muted:#b7c2d6; --ok:#33d69f; --warn:#f5c451; --hot:#ff6b6b; --accent:#5b8dff;
    --card-alpha:.68;           /* tiles and header sit slightly translucent over the art */
    --card-blur:14px;
  }
  *{box-sizing:border-box}
  html,body{min-height:100%}
  body{margin:0;color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:20px 22px 18px;
       /* /background serves the image configured in accounts.json when there is one, and
          answers 404 when there is not — the colour in --bg is what the reader sees then, so
          the CSS never needs to know which. */
       /* `background-attachment: fixed` is applied only in the prefers-reduced-motion block
          below: the shorthand used to set it unconditionally, which made that media query dead
          code and gave a viewport-pinned image to the user who asked for less motion. */
       background:var(--bg) url("/background") center / cover no-repeat}
  /* Readability scrim: the photo stays visible, but text keeps its contrast in
     both light and dark areas of the image. Pointer-events off so it never
     swallows clicks. */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
       background:linear-gradient(180deg,rgba(11,13,18,.55) 0%,rgba(11,13,18,.38) 45%,rgba(11,13,18,.62) 100%)}
  @media (prefers-reduced-motion:no-preference){ body{background-attachment:fixed} }
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:18px;
       background:rgba(var(--card),var(--card-alpha));
       border:1px solid var(--line);border-radius:14px;padding:14px 16px;
       backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur))}
  h1{font-size:19px;margin:0;letter-spacing:.2px}
  .logo{width:28px;height:28px;border-radius:8px;flex:0 0 auto;align-self:center;display:block}
  .muted{color:var(--muted);font-size:12.5px}
  /* Inline Font Awesome Free 7.3.1 solid marks (icons CC BY 4.0, Fonticons Inc. — see License in
     the README). Inlined rather than fetched: the panel's own egress is one request per provider,
     and a CDN <link> would add a fourth-party request and leave the page iconless offline. 1em
     keeps them on the text's optical line, currentColor keeps them in the state colour. */
  /* The gap comes from this margin, not from the space in the markup: the glyph is an inline-block
     SVG in a flex row, and a text space next to it collapses to nothing against the box edge, so
     the mark reads as glued to the first word. em keeps the gap proportional to the text. */
  .ic{display:inline-block;width:1em;height:1em;vertical-align:-.125em;margin-right:.5em}
  .ic svg{display:block;width:100%;height:100%;fill:currentColor}
  .card{background:rgba(var(--card),var(--card-alpha));border:1px solid var(--line);border-radius:14px;
       padding:16px 16px 14px;
       backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur))}
  .grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fill,minmax(310px,1fr))}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  /* The mark sits flush with the label so the head reads [logo] name / plan … pill.
     Fixed size and flex:0 0 auto keep it from shifting when a label wraps. */
  .card-id{display:flex;gap:9px;align-items:flex-start;min-width:0}
  /* The marks are SVG files loaded through <img>, and `currentColor` cannot cross that
     boundary: inside an <img> it resolves to the file's own default (black), never the
     page's colour, so the `color:` rule that used to sit here did nothing and every mark
     rendered black on a dark card. Force them to white instead -- which also means the
     files' own stroke colour is free, and the README badges use those same files on a
     white page, so they carry a mid-grey that reads on both. */
  .mark{width:20px;height:20px;flex:0 0 auto;margin-top:1px;display:block;filter:brightness(0) invert(1)}
  .bal{margin-top:11px}
  .bal-amount{font-size:26px;font-weight:600;letter-spacing:-.3px;font-variant-numeric:tabular-nums;line-height:1.15}
  .bal-amount .cur{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
  .bal-amount.empty{color:var(--warn)}
  .bal-note{font-size:11.5px;color:var(--muted);margin-top:3px}
  .label{font-weight:600;font-size:15px;margin:0}   /* an h2: the card's title, for a reader */
  .plan{font-size:11.5px;color:var(--muted);margin-top:2px}
  .pill{font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap}
  .pill.ok{color:var(--ok);border-color:#1d5c47}
  /* Dashed and muted: "documented" must not read as "verified live". */
  .pill.doc{color:var(--muted);border-style:dashed}
  /* #ff6b6b measured 3.50:1 on the card surface at 11px — below AA, on the one marker that
     distinguishes a failing card from a live one in a screenshot. #ffa8a8 measures 5.28:1. */
  /* The modifier is `bad`, not `err`: an error pill used to carry class="pill err", so it also
     matched the `.err` error-BOX rule below (background, 9px/11px padding, 9px radius) and the
     last matching rule won on source order — the pill was painted as a big red block. */
  .pill.bad{color:#ffa8a8;border-color:#5c2020}
  .win{margin-top:11px}
  .win-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .win-name{color:var(--muted);text-transform:uppercase;letter-spacing:.6px;font-size:11px}
  .win-val{font-variant-numeric:tabular-nums}
  .bar{height:7px;border-radius:999px;background:var(--card-2);overflow:hidden}
  .fill{height:100%;border-radius:999px;background:var(--ok);transition:width .4s ease}
  .fill.warn{background:var(--warn)} .fill.hot{background:var(--hot)}
  .reset{font-size:11.5px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .err{margin-top:12px;font-size:12.5px;color:#ffb4b4;background:#231418;
       border:1px solid #4a2020;border-radius:9px;padding:9px 11px}
  .totals{margin-top:10px;font-size:10.5px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px;line-height:1.35}
  .waiting{color:var(--muted);font-size:13px;padding:18px 2px}
  /* The two status halves are one group on the right, opposite the logo and the title. */
  #feed{margin-left:auto;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center}
  #feed.stale{color:var(--warn)}
  #feed.down{color:var(--hot)}
  </style>
</head>
<body>
<header>
  <img class="logo" src="/static/favicon.svg" width="28" height="28" alt="">
  <h1>Quota Panel</h1>
  <!-- #feed repaints once a second, so it is deliberately NOT a live region: a screen reader
       would announce the countdown on every tick. It is the header's one number. -->
  <span class="muted" id="feed"></span>
</header>

<main>
  <div class="grid" id="grid"><div class="card waiting">Loading…</div></div>
</main>

<noscript>
  <div class="card waiting">This panel paints its data with JavaScript. The raw payload is at
    <a href="/api/quota">/api/quota</a>.</div>
</noscript>

<script>
'use strict';
const TICK_MS = 1000;            // countdown repaint
// One cadence, and it is the server's: QUOTA_POLL_SECONDS is how often the numbers are
// republished, and the header counts down to the next publication. These bounds mirror the
// 10..3600 the server validates its own config against.
const MIN_POLL_MS = 10000;
const MAX_POLL_MS = 3600000;
const RETRY_MS = 15000;             // a failed fetch is retried sooner than a whole cadence
const FETCH_TIMEOUT_MS = 8000;      // below MIN_POLL_MS: a fetch must settle before the next one
// The client polls exactly the interval the user configured, and the server republishes slightly
// inside it. The other direction -- client waits a cadence and a bit -- is what made a 30s setting
// refresh every 33s, and then forced the header to choose between printing 33 (not the number the
// user set) or printing 30 (a number it did not wait). Neither is acceptable: the panel says the
// configured interval and refreshes on it.
const SERVER_MARGIN = 0.9;          // the server's own republish interval, as a fraction
const RELOAD_AFTER = 3;          // consecutive failed fetches before the page attempts a reload
const MAX_RELOADS = 3;           // …and never more than this many in one document

let data = null, clockSkew = 0, pollMs = 60000;   // clockSkew: display-only server offset
let lastOkAt = null, failStreak = 0, timer = null, inFlight = false;
let reloads = 0, lastError = '', reloadTimer = null;
let nextFetchAt = null;          // client-clock instant of the next fetch; what the countdown counts to

const colorFor = p => p >= 90 ? 'hot' : p >= 70 ? 'warn' : '';

function esc(s){ return String(s === null || s === undefined ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// Font Awesome Free 7.3.1 solid, inlined: the icons are CC BY 4.0 (Fonticons, Inc.), and the
// paths are pasted rather than fetched so the page keeps making no request of its own. `clock`
// marks when the numbers were published, `rotate` the refresh cadence, and `warning`/`down` the
// two degraded feed states that used to be the emoji U+26A0 and U+26D4. All four inherit
// currentColor, so they follow the state colour like the text beside them.
//
// The emoji were the problem: they render as whatever colour font the viewer happens to have
// installed, which is exactly what #feed.stale/--warn and #feed.down/--hot exist to control, so a
// red warning triangle could sit in amber text. They are also two bytes of surprise in a header
// whose other mark was already SVG.
//
// These three marks are the only reason innerHTML is used outside cardHtml(). Safe by
// construction: what is concatenated around them is either a fixed phrase from updateText()
// (the words updating/retrying/now and a number of seconds) or an escaped error through esc() —
// no provider-supplied text reaches any of the three call sites.
const ICON = {
  rotate: '<span class="ic" aria-hidden="true"><svg viewBox="0 0 512 512"><path d="M480.1 192l7.9 0c13.3 0 24-10.7 24-24l0-144c0-9.7-5.8-18.5-14.8-22.2S477.9 .2 471 7L419.3 58.8C375 22.1 318 0 256 0 127 0 20.3 95.4 2.6 219.5 .1 237 12.2 253.2 29.7 255.7s33.7-9.7 36.2-27.1C79.2 135.5 159.3 64 256 64 300.4 64 341.2 79 373.7 104.3L327 151c-6.9 6.9-8.9 17.2-5.2 26.2S334.3 192 344 192l136.1 0zm29.4 100.5c2.5-17.5-9.7-33.7-27.1-36.2s-33.7 9.7-36.2 27.1c-13.3 93-93.4 164.5-190.1 164.5-44.4 0-85.2-15-117.7-40.3L185 361c6.9-6.9 8.9-17.2 5.2-26.2S177.7 320 168 320L24 320c-13.3 0-24 10.7-24 24L0 488c0 9.7 5.8 18.5 14.8 22.2S34.1 511.8 41 505l51.8-51.8C137 489.9 194 512 256 512 385 512 491.7 416.6 509.4 292.5z"/></svg></span>',
  warning: '<span class="ic" aria-hidden="true"><svg viewBox="0 0 512 512"><path d="M256 0c14.7 0 28.2 8.1 35.2 21l216 400c6.7 12.4 6.4 27.4-.8 39.5S486.1 480 472 480L40 480c-14.1 0-27.2-7.4-34.4-19.5s-7.5-27.1-.8-39.5l216-400c7-12.9 20.5-21 35.2-21zm0 352a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.5 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z"/></svg></span>',
  down: '<span class="ic" aria-hidden="true"><svg viewBox="0 0 512 512"><path d="M256 512a256 256 0 1 0 0-512 256 256 0 1 0 0 512zM167 167c9.4-9.4 24.6-9.4 33.9 0l55 55 55-55c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-55 55 55 55c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-55-55-55 55c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l55-55-55-55c-9.4-9.4-9.4-24.6 0-33.9z"/></svg></span>',
};

// Paint the placeholder before the first poll lands, so the mark is there from the first frame
// instead of appearing with the first payload.

// clockSkew is (server clock - client clock), measured once per fetch. It exists ONLY to read
// server-side stamps correctly (the age of the data, the reset countdowns) and deliberately plays
// no part in scheduling: the refresh interval is the page's own, derived from `poll_seconds`, so a
// missing or wrong `now` cannot bend it. Before this split, the same value also positioned the
// next fetch, and that is how a clock hiccup became a 3-second countdown.
// clientNow + skew. A reset stamp is on the server's clock, so the skew belongs on the clock —
// the old code added it to the stamp instead, which doubled the error in the opposite
// direction: a client 5 minutes slow was told a window reset in 20 minutes when 10 remained.
function serverNow(){ return Date.now() + clockSkew; }

// The age of the DATA, not of the last successful fetch: /api/quota answers 200 with every
// account in error, so an HTTP success says nothing about whether the numbers are moving.
// serverNow() is the server's clock, so `serverNow() - generated_at` is that age directly.
function dataAge(){
  const fallback = lastOkAt === null ? 0 : Math.round((Date.now() - lastOkAt)/1000);
  if(!data || !data.generated_at) return fallback;
  const born = Date.parse(data.generated_at);
  if(isNaN(born)) return fallback;
  return Math.max(0, Math.round((serverNow() - born)/1000));
}

function isStale(){
  const cadence = (data && data.poll_seconds) || 60;
  return dataAge() > cadence * 3;
}

// The server's publication cadence in ms: `poll_seconds`, clamped to the same 10..3600 the
// server validates its config against. The page's refresh rate is this, and only this — the
// numbers cannot move more often than the server republishes them, so the page follows that
// clock instead of running a second one of its own.
function dataCadenceMs(){
  const declared = (data && data.poll_seconds) || 60;
  return Math.min(MAX_POLL_MS, Math.max(MIN_POLL_MS, declared * 1000));
}

// The client's wait is the configured cadence, verbatim -- not a margin on top of it. The margin
// that prevents a poll landing fractionally before the publication it is waiting for belongs on
// the server's side of the race (see poller_loop), where it costs the user nothing: he asked for a
// 30-second panel and gets one, and the header can print his own number truthfully.
function nextWaitMs(){
  return dataCadenceMs();
}

// The header's one number: when the page next asks the server, which is when the numbers are
// expected to change. It used to print two intervals and the data's age — three numbers, two of
// them intervals of a machine nobody asked about, which is how "every 60s, checked every 30s"
// ended up on a page that visibly moved once a minute.
function secondsToUpdate(){
  if(nextFetchAt === null) return null;
  return Math.max(0, Math.ceil((nextFetchAt - Date.now())/1000));
}

function updateText(verb){
  const s = secondsToUpdate();
  if(s === null) return 'waiting for the first update';
  if(s <= 0) return verb + ' now…';
  // Phrased with the literal "in N seconds" kept contiguous: the smoke test asserts the served
  // page contains it, because a countdown that stopped saying the unit was one of the ways the
  // header used to lie.
  return s === 1 ? `${verb} in 1 second` : `${verb} in ${s} seconds`;
}

function countdown(iso){
  if(!iso) return '';
  const target = Date.parse(iso);
  if(isNaN(target)) return '';
  let s = Math.floor((target - serverNow())/1000);
  if(s <= 0) return 'resetting…';
  const d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); const sec = s - m*60;
  if(d) return `resets in ${d}d ${h}h`;
  if(h) return `resets in ${h}h ${m}m`;
  if(m) return `resets in ${m}m ${sec}s`;
  return `resets in ${sec}s`;
}

function fmtNum(v){
  // Total on purpose: a field of the wrong JS type used to throw inside render(), and a throw
  // there cleared the whole grid. A numeric string is accepted rather than called unreadable —
  // "98.5" from a provider is a number, not an error.
  const n = typeof v === 'number' ? v : Number(v);
  if(v === null || v === undefined || v === '' || !isFinite(n)) return '—';
  if(Math.abs(n - Math.round(n)) < 0.005) return String(Math.round(n));
  return n.toFixed(2);
}

// A percent that is missing, or is not a number at all, is not 0% — and it is not 100% either.
// `width:NaN%` is an invalid declaration, so the bar fell back to a full-width green fill next
// to the label "—%": a shape no reading supports. Clamp once, and use that value everywhere.
function numericPercent(v){
  const n = typeof v === 'number' ? v : Number(v);
  if(v === null || v === undefined || v === '' || !isFinite(n)) return null;
  return Math.min(100, Math.max(0, n));
}

const CUR_SYMBOL = {USD:'$', CNY:'¥', EUR:'€', GBP:'£', JPY:'¥'};

// A money balance has no cap, so there is no percentage to draw: the number IS the
// reading. Never render 0% here — an exhausted balance and an unread one look
// identical in a bar, and one of them means "you cannot make calls right now".
function renderBalance(w){
  const parsed = (w.amount === null || w.amount === undefined || w.amount === '') ? null : Number(w.amount);
  // A non-numeric amount is unreadable — not zero, and never the string "NaN".
  const amount = parsed === null || !isFinite(parsed) ? null : parsed;
  const cur = w.currency || 'USD';
  const sym = CUR_SYMBOL[cur] || '';
  const exhausted = amount !== null && amount <= 0;
  // Built unescaped: this string is escaped once, where it is interpolated. Escaping the
  // currency here and again there printed literal "&lt;i&gt;USD&lt;/i&gt;" to the user.
  const shown = amount === null ? '—'
    : (sym ? sym + amount.toFixed(2) : amount.toFixed(2) + ' ' + cur);
  let html = `<div class="bal">
      <div class="bal-amount${exhausted ? ' empty' : ''}">${esc(shown)}${
        sym ? `<span class="cur">${esc(cur)}</span>` : ''}</div>`;
  if(amount === null){
    html += `<div class="bal-note">${esc(w.note || 'no reading')}</div>`;
  } else if(exhausted){
    html += `<div class="bal-note">${esc(w.note || 'balance exhausted')}</div>`;
  } else if(w.note){
    html += `<div class="bal-note">${esc(w.note)}</div>`;
  }
  const ex = w.extra || {};
  const bits = [];
  if(ex.total_credits !== undefined) bits.push(`${fmtNum(ex.total_credits)} credited`);
  if(ex.total_usage !== undefined) bits.push(`${fmtNum(ex.total_usage)} spent`);
  if(ex.usage_daily !== undefined) bits.push(`today ${fmtNum(ex.usage_daily)}`);
  if(ex.reserved_usd !== undefined) bits.push(`${fmtNum(ex.reserved_usd)} reserved`);
  if(ex.voucher_balance !== undefined) bits.push(`voucher ${fmtNum(ex.voucher_balance)}`);
  if(ex.cash_balance !== undefined) bits.push(`cash ${fmtNum(ex.cash_balance)}`);
  if(ex.granted_balance !== undefined) bits.push(`granted ${fmtNum(ex.granted_balance)}`);
  if(ex.topped_up_balance !== undefined) bits.push(`topped up ${fmtNum(ex.topped_up_balance)}`);
  if(bits.length) html += `<div class="bal-note">${esc(bits.join(' · '))}</div>`;
  if(w.resets_at) html += `<div class="reset" data-reset="${esc(w.resets_at)}">${countdown(w.resets_at)}</div>`;
  html += `</div>`;
  return html;
}

function setFeed(){
  const el = document.getElementById('feed');
  if(lastOkAt === null){
    // Never tell the user "Loading…" forever: if the very first fetch failed, say so.
    if(!lastError){ el.textContent = ''; el.className = 'muted'; return; }
    el.innerHTML = ICON.down + ' no data yet — ' + esc(lastError);
    el.className = 'muted down';
    return;
  }
  const age = dataAge();
  const tail = lastError ? ` — ${lastError}` : '';
  const stale = isStale();
  // The mark carries the state and is the only thing that changes with it: colour alone is easy
  // to miss in a screenshot or a terminal. The phrase itself never becomes arithmetic — one
  // number, counting down to the next update.
  if(failStreak === 0 && !stale){
    el.innerHTML = ICON.rotate + ' ' + updateText('updating');
    el.className = 'muted';
  } else if(failStreak < RELOAD_AFTER){
    // A payload that parsed fine but stopped moving is not a healthy feed: /api/quota answers
    // 200 with every account in error, so HTTP success alone says nothing about the data.
    el.innerHTML = ICON.warning + ' ' + updateText(failStreak ? 'retrying' : 'updating')
                 + ` (${stale ? 'data stale' : 'reconnecting'}, data ${age}s old)` + esc(tail);
    el.className = 'muted stale';
  } else {
    el.innerHTML = ICON.down + ' feed down — ' + updateText('retrying')
                 + ` (data ${age}s old)` + esc(tail);
    el.className = 'muted down';
  }
}

// One card's markup. It returns a string so that a throw cannot leave the grid half-built:
// render() clears the grid first, so an exception in here used to blank the page while the
// indicator still claimed "auto-refresh every 30s", and that same exception escaped load() as an
// unhandled rejection — the count then oscillated 0→1 and the reload path was never reached.
//
// setFeed() sets innerHTML too, for the same reason: its mark is an SVG. The only outside value
// it interpolates is lastError, which is escaped with esc() at every site — the branches used to
// assign textContent, so switching them without escaping would have made a server-supplied error
// string executable markup.
//
// Why setting innerHTML from this string is safe: every value that originates outside this file
// (label, plan, account_name, error, notes, resets_at, currency, state, logo) is passed through
// esc() at the point of interpolation, and esc() escapes &, <, > and ". The only unescaped
// interpolations are the outputs of fmtNum(), numericPercent() and colorFor(), which can only
// produce digits, "-", "." and the fixed literals ''/'warn'/'hot'. Attribute contexts are all
// double-quoted, and src= values are appended to a root-relative path, so a config-supplied
// logo cannot become an off-origin or javascript: URL.
function cardHtml(acc){
  const ok = acc.state === 'ok';
  // The mark is keyed off the provider the server resolved, falling back to the
  // neutral glyph — a missing logo file must never render a broken-image box.
  const mark = acc.logo || '_fallback.svg';
  // A green "live" pill has to mean what the server means by it: `contract` records whether the
  // adapter was exercised against a real response ('live'), built from the vendor's published
  // contract ('documented'), or shaped from independent implementations because the vendor
  // publishes nothing for that route ('third-party'). The server serves that field so the UI
  // "can never imply more than was measured" — and the card used to badge every healthy
  // account the same. The pill now carries the server's own word instead of re-deriving one
  // from two values: z.ai registered as "third-party" was rendering "documented", a promise
  // the adapter could not support.
  const contract = acc.contract || 'documented';
  const documented = contract !== 'live';
  const pill = ok ? contract : acc.state;
  const pillTitle = ok
    ? (acc.contract_note || (documented
        ? 'built from the vendor’s published contract — not yet exercised against a real response'
        : 'exercised against a real provider response'))
    : (acc.error || acc.state);
  let html = `<div class="card-head">
      <div class="card-id">
        <img class="mark" src="/static/logos/${esc(mark)}" width="20" height="20" alt="" aria-hidden="true">
        <div style="min-width:0">
          <h2 class="label">${esc(acc.label)}</h2>
          <div class="plan">${esc(acc.plan || acc.provider)}${acc.account_name ? ' · ' + esc(acc.account_name) : ''}</div>
        </div>
      </div>
      <span class="pill ${ok ? (documented ? 'doc' : 'ok') : 'bad'}" title="${esc(pillTitle)}">${esc(pill)}</span>
    </div>`;
  if(!ok){
    // http_status is kept separate from state by the server precisely so a card can say "the
    // provider answered 500" without inventing a reason; it was served and never rendered.
    html += `<div class="err">${esc(acc.error || acc.state)}${
      acc.http_status ? esc(' (HTTP ' + acc.http_status + ')') : ''}</div>`;
    return html;
  }
  for(const w of (acc.windows || [])){
    if((w.kind || 'window') === 'balance'){
      html += renderBalance(w);
      continue;
    }
    const p = numericPercent(w.percent);
    const label = p === null ? (w.note || '—') : fmtNum(p) + '%';
    html += `<div class="win" data-reset="${esc(w.resets_at || '')}">
        <div class="win-top"><span class="win-name">${esc(w.label)}</span><span class="win-val">${esc(label)}</span></div>`;
    if(p !== null){
      html += `<div class="bar"><div class="fill ${colorFor(p)}" style="width:${p}%"></div></div>`;
    }
    // The note is printed exactly once, on the detail line: it used to be dropped whenever a
    // percent was present (except the magic string "credits") and printed twice when it was not.
    const detail = [];
    const cd = countdown(w.resets_at);
    if(cd) detail.push(cd);
    if(w.used !== null && w.used !== undefined && w.cap) detail.push(`${fmtNum(w.used)} / ${fmtNum(w.cap)}`);
    if(w.note && p !== null) detail.push(String(w.note));
    if(detail.length) html += `<div class="reset">${esc(detail.join(' · '))}</div>`;
    html += `</div>`;
  }
  const t = acc.totals || {};
  if(t.requests || t.tokens_in){
    html += `<div class="totals">${fmtNum(t.requests || 0)} requests · in ${fmtNum(t.tokens_in || 0)} / out ${fmtNum(t.tokens_out || 0)} tokens${t.success_rate !== undefined && t.success_rate !== null ? ' · ' + fmtNum(t.success_rate) + '% success' : ''}</div>`;
  }
  if(acc.period_end){
    // The server passes a provider-supplied string through when it merely looks ISO-ish, so an
    // unparseable one used to print "period ends Invalid Date" as if it were a fact.
    const end = Date.parse(acc.period_end);
    html += `<div class="reset">period ends ${isNaN(end) ? esc(acc.period_end) : new Date(end).toLocaleString()}</div>`;
  }
  return html;
}

function render(){
  const grid = document.getElementById('grid');
  if(!data){ return; }
  const accounts = data.accounts || [];
  grid.innerHTML = '';
  if(!accounts.length){
    grid.innerHTML = '<div class="card waiting">Waiting for the first provider poll…</div>';
  }
  for(const acc of accounts){
    const el = document.createElement('div');
    el.className = 'card';
    try{
      // Every interpolated value in cardHtml passes through esc() (label/plan/error/notes come
      // from the local config and provider APIs), so no raw remote string is parsed as markup.
      el.innerHTML = cardHtml(acc);
    }catch(e){
      // One malformed field must cost one card, not the whole grid — and the failure has to be
      // visible, because a blank panel under a green indicator is the worst possible outcome.
      el.innerHTML = `<h2 class="label">${esc(acc.label || acc.id || 'account')}</h2>
          <div class="err">could not render this card: ${esc((e && e.message) || String(e))}</div>`;
    }
    grid.appendChild(el);
  }
  setFeed();
}

function tick(){
  // Window cards put data-reset on the wrapper (.win) and the text lives in a .reset child;
  // balance cards put it on the .reset element itself. Only the first shape used to be
  // matched, so every money card's countdown froze at render time while the window countdowns
  // beside it kept ticking.
  for(const el of document.querySelectorAll('[data-reset]')){
    const iso = el.getAttribute('data-reset');
    const node = el.classList.contains('reset') ? el : el.querySelector('.reset');
    if(!node || !iso) continue;
    const cd = countdown(iso);
    if(!cd) continue;
    const parts = node.textContent.split(' · ');
    node.textContent = cd + (parts.length > 1 ? ' · ' + parts.slice(1).join(' · ') : '');
  }
  setFeed();
}

// One clock, and it is the server's: the page polls one cadence after its own last fetch, so the
// interval between two requests is always pollMs — slightly longer, never shorter, than the
// server's republication period.
//
// What used to be here counted down to a *stamp-derived* instant and, when a fetch happened to
// arrive before the next publication landed, armed itself 2.5s out. Nothing reset it to the
// cadence unless a fresh stamp appeared first, so the header settled into counting 3, 2, 1
// forever — a countdown that was accurate about a timer that should never have been set. The
// alignment bought one request per publication; it cost a page that reported garbage as soon as
// the timing drifted, which is a bad trade for a dashboard.
function scheduleNext(overrideMs){
  if(timer) clearTimeout(timer);
  const wait = overrideMs || nextWaitMs();
  nextFetchAt = Date.now() + wait;
  timer = setTimeout(load, wait);
}

async function load(){
  // Collapse overlapping triggers (startup + visibilitychange + focus can all fire
  // within milliseconds of each other and used to produce three identical requests).
  if(inFlight) return;
  inFlight = true;
  // A fetch that never settles used to latch `inFlight` forever: every later load() returned at
  // the line above, auto-refresh stopped, `failStreak` never moved, and nothing on the page said
  // so. Bound it, so the catch path always runs and the latch is always released.
  const ctrl = new AbortController();
  const bail = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try{
    const res = await fetch('/api/quota?t=' + Date.now(), {cache:'no-store', signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const fresh = await res.json();
    data = fresh;
    // Display only — never scheduling. No fallback to `generated_at`: that stamp is older than
    // the response by the age of the data, so using it as a clock offset would subtract the data's
    // own age and make every payload look permanently fresh (dataAge() would read 0 and isStale()
    // could never fire). A server that sends no `now` gets no offset.
    const serverClock = fresh.now;
    clockSkew = serverClock ? (Date.parse(serverClock) - Date.now()) : 0;
    lastOkAt = Date.now();
    failStreak = 0;
    lastError = '';
    if(reloadTimer){ clearTimeout(reloadTimer); reloadTimer = null; }
    pollMs = dataCadenceMs();
    scheduleNext();
    render();
  }catch(e){
    failStreak++;
    lastError = (e && e.name === 'AbortError')
      ? `no answer within ${Math.round(FETCH_TIMEOUT_MS/1000)}s`
      : ((e && e.message) || 'fetch failed');
    // Keep the last good render on screen and paint the failure state BEFORE deciding whether to
    // reload — the reload branch used to clear failStreak first, which made the "feed down" state
    // unreachable in any visible tab. setFeed() is called explicitly because render() returns
    // early when no payload has ever arrived.
    render();
    setFeed();
    // A failure retries sooner than a whole cadence, but the floor is a real interval and the
    // countdown shows exactly this value — a transient error must not turn the header into a
    // single-digit spinner.
    pollMs = dataCadenceMs();
    const backoff = Math.max(pollMs/3, Math.min(pollMs, RETRY_MS));
    scheduleNext(backoff);
    // A reload is bounded, backed off, and never a loop: the failure this page is built to
    // survive is the server being gone, and that is exactly when reloading cannot help — the old
    // bare location.reload() stormed forever, said nothing, and discarded the last good render.
    if(failStreak >= RELOAD_AFTER && document.visibilityState === 'visible'){
      if(reloads >= MAX_RELOADS){
        lastError = `${lastError} (reloads exhausted — this page will keep retrying the feed)`;
        setFeed();
      }else{
        reloads++;
        setFeed();
        reloadTimer = setTimeout(() => location.reload(), reloads * 5000);
      }
    }
  }finally{
    clearTimeout(bail);
    inFlight = false;
  }
}

// Background tabs get their timers throttled by the browser, so a visible page can
// show numbers minutes old. Refresh immediately whenever we come back to the front.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') load();
});
window.addEventListener('focus', () => load());
window.addEventListener('online', () => load());

// load() schedules the next fetch itself, whichever way it ends.
load();
setInterval(tick, TICK_MS);
</script>
</body>
</html>
