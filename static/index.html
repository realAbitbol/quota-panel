<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Cache-Control is set by the server on every response, including index.html. The
     `http-equiv="Cache-Control"` pragma that used to sit here is not in the HTML spec's
     pragma list, so it did nothing; the real header is what keeps the UI from going stale. -->
<link rel="icon" href="/static/favicon.ico" sizes="32x32">
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/favicon.svg">
<meta name="theme-color" content="#0b0d12">
<meta name="description" content="Read-only quota and credit dashboard for your AI provider keys and subscriptions: percent windows, money balances, no writes.">
<title>Quota Panel</title>
<style>
  :root{
    --bg:#0b0d12; --card:20,24,33; --card-2:#1b2130; --line:#252c3b;
    --fg:#e8ecf5; --muted:#b7c2d6; --dim:#8b95ab; --ok:#33d69f; --warn:#f5c451; --hot:#ff6b6b; --accent:#5b8dff;
    --accent-rgb:91,141,255;
    --card-alpha:.72;           /* tiles and header sit slightly translucent over the art */
    --card-blur:14px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Roboto Mono",monospace;
  }
  *{box-sizing:border-box}
  /* The page had no focus ring at all: its two interactive elements (History, the support link)
     were reachable by keyboard with nothing on screen saying where you were. */
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  html,body{min-height:100%}
  body{margin:0;color:var(--fg);
       font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
       padding:20px 22px 18px;
       /* /background serves the image configured in accounts.json when there is one, and
          answers 404 when there is not — the colour in --bg is what the reader sees then, so
          the CSS never needs to know which. */
       /* `background-attachment: fixed` is applied only in the prefers-reduced-motion block
          below: the shorthand used to set it unconditionally, which made that media query dead
          code and gave a viewport-pinned image to the user who asked for less motion. */
       background:var(--bg) url("/background") center / cover no-repeat}
  /* Readability scrim: the photo stays visible, but text keeps its contrast in
     both light and dark areas of the image. Pointer-events off so it never
     swallows clicks. */
  body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
       background:linear-gradient(180deg,rgba(11,13,18,.62) 0%,rgba(11,13,18,.46) 45%,rgba(11,13,18,.70) 100%)}
  @media (prefers-reduced-motion:no-preference){ body{background-attachment:fixed} }
  /* The header floats: it sticks to the top of the viewport while the page scrolls, so the
     panel's identity and the way to the other page never scroll out of reach. Translucent plus
     blurred, so content passing under it stays legible rather than vanishing. */
  header{position:sticky;top:20px;z-index:20;display:flex;align-items:center;gap:14px;
       flex-wrap:wrap;margin-bottom:18px;
       background:rgba(var(--card),var(--card-alpha));
       border:1px solid var(--line);border-radius:16px;padding:12px 16px;
       backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur))}
  h1{font-size:20px;margin:0;letter-spacing:-.01em;font-weight:650}
  .logo{width:28px;height:28px;border-radius:8px;flex:0 0 auto;align-self:center;display:block}
  .muted{color:var(--muted);font-size:12.5px}
  /* Inline Font Awesome Free 7.3.1 solid marks (icons CC BY 4.0, Fonticons Inc. — see License in
     the README). Inlined rather than fetched: the panel's own egress is one request per provider,
     and a CDN <link> would add a fourth-party request and leave the page iconless offline. 1em
     keeps them on the text's optical line, currentColor keeps them in the state colour. */
  /* The gap comes from this margin, not from the space in the markup: the glyph is an inline-block
     SVG in a flex row, and a text space next to it collapses to nothing against the box edge, so
     the mark reads as glued to the first word. em keeps the gap proportional to the text. */
  .ic{display:inline-block;width:1em;height:1em;vertical-align:-.125em;margin-right:.5em}
  .ic svg{display:block;width:100%;height:100%;fill:currentColor}
  .card{background:rgba(var(--card),var(--card-alpha));border:1px solid var(--line);border-radius:16px;
       padding:18px 18px 16px;
       backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur))}
  /* Which card needs a human? Every card used to carry identical weight, so finding the one at
     96% meant reading eight numbers. The tint is the information the bars already hold, hoisted
     to the card's edge — no new colour, no new word, and the numbers themselves are untouched. */
  .card.watch{border-color:#4b4021}
  .card.urgent{border-color:#5a2a26;box-shadow:inset 3px 0 0 var(--hot)}
  .card.broken{border-color:#5c2020;box-shadow:inset 3px 0 0 #8a3a32}
  /* Three columns on a wide monitor, two on a laptop, one on a phone. Explicit breakpoints rather
     than auto-fill, so a 1440px viewport does not quietly become four narrow cards. */
  .grid{display:grid;gap:18px;grid-template-columns:1fr}
  @media (min-width:700px){ .grid{grid-template-columns:1fr 1fr} }
  @media (min-width:1100px){ .grid{grid-template-columns:1fr 1fr 1fr} }
  .strip{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);
       background:rgba(var(--card),.55);border:1px solid var(--line);border-radius:12px;
       padding:9px 16px;margin-bottom:16px}
  .strip b{color:var(--fg);font-weight:600}
  .strip .warn{color:var(--warn)}
  .strip .bad{color:var(--hot)}
  .strip[hidden]{display:none}
  /* First paint only: render() rebuilds the grid on every poll, and a grid that re-staggers once
     a minute is noise rather than life. render() clears .first after its first pass. */
  @media (prefers-reduced-motion:no-preference){
    .grid.first>.card{animation:cardIn .30s ease backwards}
    .grid.first>.card:nth-child(2){animation-delay:.03s}
    .grid.first>.card:nth-child(3){animation-delay:.06s}
    .grid.first>.card:nth-child(4){animation-delay:.09s}
    .grid.first>.card:nth-child(5){animation-delay:.12s}
    .grid.first>.card:nth-child(6){animation-delay:.15s}
    .grid.first>.card:nth-child(7){animation-delay:.18s}
    .grid.first>.card:nth-child(8){animation-delay:.21s}
    .grid.first>.card:nth-child(n+9){animation-delay:.24s}
  }
  @keyframes cardIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .card-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
  /* The mark sits flush with the label so the head reads [logo] name / plan … pill.
     Fixed size and flex:0 0 auto keep it from shifting when a label wraps. */
  .card-id{display:flex;gap:9px;align-items:flex-start;min-width:0}
  /* The marks are SVG files loaded through <img>, and `currentColor` cannot cross that
     boundary: inside an <img> it resolves to the file's own default (black), never the
     page's colour, so the `color:` rule that used to sit here did nothing and every mark
     rendered black on a dark card. Force them to white instead -- which also means the
     files' own stroke colour is free, and the README badges use those same files on a
     white page, so they carry a mid-grey that reads on both. */
  .mark{width:22px;height:22px;flex:0 0 auto;margin-top:0;display:block;border-radius:4px}
  .bal{margin-top:11px}
  .bal-amount{font-size:28px;font-weight:650;letter-spacing:-.3px;font-variant-numeric:tabular-nums;line-height:1.15}
  .bal-amount .cur{font-size:14px;font-weight:500;color:var(--muted);margin-left:4px}
  .bal-amount.empty{color:var(--warn)}
  .bal-note{font-size:11.5px;color:var(--muted);margin-top:3px}
  .label{font-weight:650;font-size:15px;margin:0}   /* an h2: the card's title, for a reader */
  .plan{font-size:11.5px;color:var(--muted);margin-top:2px}
  /* A status light: a dot and one word about the reading on this card. Not a verdict on how the
     adapter that produced it was written — that is a maintainer's question, and answering it in
     the reader's header cost every account a legend. cursor:help keeps a definition on hover,
     because a dot cannot say what "stale" measured. */
  .pill{display:inline-flex;align-items:center;gap:5px;
        font-size:11px;padding:2px 8px;border-radius:999px;border:1px solid var(--line);color:var(--muted);white-space:nowrap;cursor:help}
  .pill .dot{width:6px;height:6px;border-radius:50%;background:currentColor;flex:0 0 auto}
  .pill.ok{color:var(--ok);border-color:#1d5c47}
  /* Amber, not red: nothing here is broken, the server has simply stopped republishing. */
  .pill.old{color:var(--warn);border-color:#5a4a1d}
  /* #ff6b6b measured 3.50:1 on the card surface at 11px — below AA, on the one marker that
     distinguishes a failing card from a live one in a screenshot. #ffa8a8 measures 5.28:1. */
  /* The modifier is `bad`, not `err`: an error pill used to carry class="pill err", so it also
     matched the `.err` error-BOX rule below (background, 9px/11px padding, 9px radius) and the
     last matching rule won on source order — the pill was painted as a big red block. */
  .pill.bad{color:#ffa8a8;border-color:#5c2020;background:rgba(255,107,107,.12)}
  .pill.ok{background:rgba(51,214,159,.12)}
  .pill.old{background:rgba(245,196,81,.12)}
  .win{margin-top:11px}
  .win-top{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}
  .win-name{color:var(--dim);text-transform:uppercase;letter-spacing:.7px;font-size:10.5px;font-weight:600}
  /* The value sat at the same size as its own label, so the number a reader came for read second.
     Half a step up plus a weight puts the hierarchy the right way round. */
  .win-val{font-variant-numeric:tabular-nums;font-size:15px;font-weight:650;letter-spacing:-.01em}
  .bar{height:7px;border-radius:999px;background:var(--card-2);overflow:hidden}
  .fill{height:100%;border-radius:999px;background:var(--ok);transition:width .4s ease}
  .fill.warn{background:var(--warn)} .fill.hot{background:var(--hot)}
  /* When the envelope refills is the second thing a reader looks for, and it was the smallest
     text on the card. The when-part carries the emphasis; the numbers beside it (used / cap) stay
     in --muted, so the line still reads as one sentence rather than two claims. */
  .reset{font-size:12px;color:var(--muted);margin-top:4px;font-variant-numeric:tabular-nums}
  .reset .rest{color:var(--dim)}
  .reset .when{color:var(--fg);font-weight:500}
  /* Inside the last day the refill is imminent -- the one moment this line should be what you
     notice. tick() keeps the class true as the clock crosses the boundary. */
  .reset.soon .when{color:var(--warn);font-weight:600}
  .err{margin-top:12px;font-size:12.5px;color:#ffb4b4;background:#231418;
       border:1px solid #4a2020;border-radius:9px;padding:9px 11px}
  /* 10.5px was the smallest text here and the first casualty of a bright artwork. */
  .totals{margin-top:10px;font-size:11px;color:var(--dim);border-top:1px dashed var(--line);padding-top:8px;line-height:1.35}
  .waiting{color:var(--muted);font-size:13px;padding:18px 2px}
  /* The two status halves are one group on the right, opposite the logo and the title. */
  #feed{margin-left:auto;font-variant-numeric:tabular-nums;display:inline-flex;align-items:center}
  #feed.stale{color:var(--warn)}
  #feed.down{color:var(--hot)}
  /* The mark turns once when a fresh payload has landed, so "the numbers just moved" is visible
     without adding a word to the header. The SVG turns, not the .ic box: a rotated box grows its
     bounding rect, and the capture harness measures the gap between that box and the first word. */
  @media (prefers-reduced-motion:no-preference){
    #feed.fresh .ic svg{animation:spin .9s ease}
  }
  @keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
  /* The Dashboard/History switch: one segmented control, the same shape as the clock's Local/UTC
     toggle. The active page is filled; the other is a quiet label you can leave for. */
  /* inline-grid with equal columns: both halves are the same width whatever the labels, so the
     control reads as one switch rather than two labels of different length. */
  .navseg{display:inline-grid;grid-auto-flow:column;grid-auto-columns:1fr;
       border:1px solid var(--line);border-radius:9px;overflow:hidden;font-size:12.5px}
  /* `hidden` must win over the display above: with one page to reach there is no switch to draw. */
  .navseg[hidden]{display:none}
  .navseg-item{display:inline-flex;align-items:center;justify-content:center;gap:6px;font-weight:600;
       color:var(--muted);text-decoration:none;padding:4px 14px;cursor:pointer}
  .navseg-item+.navseg-item{border-left:1px solid var(--line)}
  .navseg-item.on{background:var(--accent);color:#fff;cursor:default}
  .navseg-item:not(.on):hover{color:var(--fg);background:rgba(var(--accent-rgb),.10)}
  .navseg-item:active{transform:translateY(1px)}
  @media (prefers-reduced-motion:no-preference){
    .navseg-item{transition:color .15s,background .15s}
  }
  /* The support link: fixed, small, out of the reading column. An anchor, not a resource load. */
  .kofi{position:fixed;right:16px;bottom:16px;z-index:60;display:inline-flex;align-items:center;
       gap:0;padding:8px;border-radius:999px;text-decoration:none;font-size:12.5px;
       color:var(--fg);background:rgba(var(--card),.8);border:1px solid var(--line);
       backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);box-shadow:0 4px 16px rgba(0,0,0,.35)}
  .kofi:hover{color:#fff;border-color:var(--accent)}
  .kofi svg{width:15px;height:15px;fill:#ff5e5b;flex:0 0 auto}
  /* Collapsed to the heart alone; the word appears on hover (or keyboard focus). The pill is
     anchored right, so it grows leftward, and aria-label carries the name while it is hidden. */
  .kofi span{font-weight:600;max-width:0;opacity:0;overflow:hidden;white-space:nowrap}
  .kofi:hover span,.kofi:focus-visible span{max-width:5em;opacity:1;margin-left:7px}
  @media (prefers-reduced-motion:no-preference){
    .kofi{transition:color .15s,border-color .15s}
    .kofi span{transition:max-width .18s ease,opacity .18s ease,margin-left .18s ease}
  }
  @media (prefers-reduced-motion:reduce){ .fill{transition:none} }
  /* The support pill is fixed: on a narrow screen it used to come to rest over the last card. */
  @media (max-width:640px){ body{padding:14px 14px 68px} }
  /* A separate rule: the line above is string-matched by tests/history.py, so the floating
     header's offset lives where it cannot disturb it. */
  @media (max-width:640px){ header{top:14px} }

  /* DeepSeek price clock. DeepSeek API pricing is half off-peak, and the peak windows are the
     same for everyone who calls its models — including through a provider this panel does not
     track — so the clock is a page-level bar, not a card. It is one line; the full schedule
     (status, countdown, the day's windows, a 24-hour timeline) opens beneath it. Off-peak wears
     --ok, peak wears --warn: peak is dearer, not broken, and red here would read as an error. */
  .clock{display:flex;align-items:center;gap:12px;width:100%;color:var(--fg);margin:0 0 16px;
       background:rgba(var(--card),var(--card-alpha));border:1px solid var(--line);border-radius:12px;
       padding:8px 12px 8px 16px;backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur))}
  .clock[hidden]{display:none}
  .clock:hover{border-color:var(--accent)}
  /* Unwrapped, the bar and the panel read as one tile: hovering either accents both. The seam they
     share keeps the hairline colour, so the OUTER edge lights up rather than an inner rule. */
  .clock.dc-open:hover{border-bottom-color:var(--line)}
  .clock:has(+ .clock-panel:hover){border-color:var(--accent);border-bottom-color:var(--line)}
  .clock:hover+.clock-panel,.clock-panel:hover{border-color:var(--accent);border-top-color:var(--line)}
  /* The info half is the expand button; the notify switch and the chevron sit beside it. */
  .dc-head{display:flex;align-items:center;gap:14px;flex:1 1 auto;min-width:0;text-align:left;
       background:none;border:0;padding:3px 0;margin:0;color:inherit;font:inherit;cursor:pointer}
  /* Wrap/unwrap: the bar is the panel's header. Open, the two share one seam and the chevron
     turns over; closed, the bar is a standalone pill again. */
  .clock.dc-open{border-top-left-radius:16px;border-top-right-radius:16px;border-bottom-left-radius:0;border-bottom-right-radius:0;margin-bottom:0}
  .clock.dc-open+.clock-panel{border-top-left-radius:0;border-top-right-radius:0;margin-top:-1px}
  .dc-brand{display:inline-flex;align-items:center;gap:7px;font-weight:700;white-space:nowrap}
  .dc-brand::after{content:"·";color:var(--dim);font-weight:400}
  /* DeepSeek's own mark beside its name, at the bar's text scale rather than the card's. */
  .dc-logo{width:18px;height:18px;border-radius:4px;flex:none;display:block}
  .dc-kind{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:11px;
       letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
  .dc-dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
  .clock.off .dc-kind,.clock.off .dc-count{color:var(--ok)}
  .clock.peak .dc-kind,.clock.peak .dc-count{color:var(--warn)}
  .dc-count{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:17px;font-weight:700;line-height:1}
  .dc-meta{font-size:12px;color:var(--muted);white-space:nowrap}
  /* The day bar fills the slack in the bar, so the notify switch sits right beside it at the
     right end instead of after a gap. (The panel's own day bar is full width already.) */
  .dc-timeline{position:relative;height:8px;flex:1 1 auto;min-width:80px}
  .dc-track{display:flex;gap:2px;height:8px}
  .dc-seg{height:100%}
  .dc-seg.off{background:var(--ok);opacity:.55}
  .dc-seg.peak{background:var(--warn);opacity:.6}
  .dc-seg:first-child{border-radius:4px 0 0 4px}
  .dc-seg:last-child{border-radius:0 4px 4px 0}
  .dc-now{position:absolute;top:-3px;height:14px;width:2px;background:var(--fg);border-radius:1px;
       box-shadow:0 0 0 2px rgba(11,13,18,.55)}
  .dc-chev{display:inline-flex;background:none;border:0;padding:3px 2px;margin:0;color:var(--dim);
       cursor:pointer;flex:none}
  .dc-chev:hover{color:var(--fg)}
  .clock.dc-open .dc-chev{transform:rotate(180deg)}
  .dc-chev svg{display:block;width:14px;height:14px}
  @media (prefers-reduced-motion:no-preference){ .dc-chev{transition:transform .18s ease,color .15s ease} }

  /* The whole unwrapped tile is clickable (a click wraps it back), so the panel says so with the
     same finger the bar's own button uses; the controls inside keep their own pointer. */
  .clock-panel{cursor:pointer;margin:0 0 16px;background:rgba(var(--card),var(--card-alpha));
       border:1px solid var(--line);border-radius:16px;overflow:hidden;
       backdrop-filter:blur(var(--card-blur));-webkit-backdrop-filter:blur(var(--card-blur))}
  .clock-panel[hidden]{display:none}
  .dc-hero{padding:15px 18px}
  .dc-hero.off{background:linear-gradient(90deg,rgba(51,214,159,.11),rgba(51,214,159,.01) 72%)}
  .dc-hero.peak{background:linear-gradient(90deg,rgba(245,196,81,.13),rgba(245,196,81,.01) 72%)}
  .dc-badge{display:inline-flex;align-items:center;gap:.5em;margin:0;font-size:11px;font-weight:700;
       letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
  .dc-hero.off .dc-badge,.dc-hero.off .dc-big,.dc-hero.off .dc-until{color:var(--ok)}
  .dc-hero.peak .dc-badge,.dc-hero.peak .dc-big,.dc-hero.peak .dc-until{color:var(--warn)}
  .dc-big{display:flex;align-items:baseline;gap:.45em;margin:.3rem 0 0;font-family:var(--mono);
       font-variant-numeric:tabular-nums;font-size:clamp(2rem,7vw,2.8rem);font-weight:700;
       line-height:1.02;letter-spacing:-.02em}
  .dc-big .dc-unit{font-family:inherit;font-size:1rem;font-weight:400;letter-spacing:0;opacity:.7}
  .dc-until{display:flex;align-items:baseline;gap:.55em;margin:.85rem 0 0;padding-top:.75rem;
       border-top:1px solid var(--line);font-size:.88rem}
  .dc-until .dc-arrow{font-family:var(--mono);opacity:.6}
  .dc-windows{padding:2px 18px 8px;border-top:1px solid var(--line)}
  .dc-wlabel{display:flex;align-items:center;gap:10px;padding:12px 0 2px;font-size:10.5px;
       text-transform:uppercase;letter-spacing:.09em;color:var(--dim);font-weight:600}
  .dc-daynote{margin-left:auto;text-transform:none;letter-spacing:0;font-size:11px;font-weight:600;
       color:var(--ok);border:1px solid rgba(51,214,159,.34);background:rgba(51,214,159,.10);
       border-radius:999px;padding:2px 9px;white-space:nowrap}
  .dc-wrow{display:grid;grid-template-columns:auto 1fr auto;gap:0 16px;align-items:baseline;
       padding:9px 0;border-top:1px solid var(--line)}
  .dc-wrow:first-child{border-top:none}
  .dc-wkind{font-weight:600;font-size:13px;white-space:nowrap}
  .dc-wrow.off .dc-wkind{color:var(--ok)}
  .dc-wrow.peak .dc-wkind{color:var(--warn)}
  .dc-wrange{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--muted);font-size:13px}
  .dc-wmeta{font-variant-numeric:tabular-nums;color:var(--dim);font-size:12.5px;white-space:nowrap;text-align:right}
  .dc-wrow.cur .dc-wkind{font-weight:800}
  .dc-wrow.cur.off .dc-wrange,.dc-wrow.cur.off .dc-wmeta{color:var(--ok)}
  .dc-wrow.cur.peak .dc-wrange,.dc-wrow.cur.peak .dc-wmeta{color:var(--warn)}
  @media (max-width:640px){
    .dc-wrow{grid-template-columns:auto 1fr;gap:.15rem .75rem}
    .dc-wmeta{grid-column:2;grid-row:1}
    .dc-wrange{grid-column:1/-1}
  }
  .dc-strip{padding:14px 18px 12px;border-top:1px solid var(--line)}
  .dc-strip .dc-timeline{height:10px;max-width:none;flex:none}
  .dc-strip .dc-track{height:10px}
  .dc-strip .dc-now{top:-4px;height:18px}
  .dc-ticks{display:flex;justify-content:space-between;margin-top:.5rem;font-family:var(--mono);
       font-size:.68rem;color:var(--dim)}
  .dc-toolbar{display:flex;align-items:center;flex-wrap:wrap;gap:10px 14px;padding:12px 18px;
       border-top:1px solid var(--line);background:rgba(11,13,18,.25)}
  .dc-tz{font-size:12px;color:var(--dim)}
  .dc-hint{font-size:11.5px;color:var(--warn)}
  .dc-hint[hidden]{display:none}
  .dc-toggle{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .dc-toggle button{appearance:none;border:none;background:transparent;font:inherit;font-size:11.5px;
       padding:3px 11px;color:var(--muted);cursor:pointer}
  .dc-toggle button+button{border-left:1px solid var(--line)}
  .dc-toggle button.on{background:var(--accent);color:#fff}
  .dc-notify{display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--muted);
       cursor:pointer;user-select:none;flex:none}
  .dc-notify-word{white-space:nowrap}
  @media (max-width:760px){
    /* Keep the checkbox; drop the word visually but not for assistive tech. */
    .dc-notify-word{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
  }
  .dc-notify input{appearance:none;-webkit-appearance:none;margin:0;width:34px;height:20px;border-radius:999px;
       background:var(--card-2);border:1px solid var(--line);position:relative;cursor:pointer;flex:none;
       transition:background .15s,border-color .15s}
  .dc-notify input::after{content:"";position:absolute;top:2px;left:2px;width:14px;height:14px;border-radius:50%;
       background:var(--dim);transition:transform .15s,background .15s}
  .dc-notify input:checked{background:rgba(51,214,159,.28);border-color:#1d5c47}
  .dc-notify input:checked::after{transform:translateX(14px);background:var(--ok)}
  /* API rates, drawn only on a DeepSeek card: these are DeepSeek's own per-token prices, which
     apply where you pay DeepSeek directly — not where a reseller bills for its models. */
  .dc-rates{margin-top:12px;padding-top:11px;border-top:1px dashed var(--line)}
  .dc-rates-head{font-size:10.5px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;color:var(--dim)}
  .dc-rates-kind{color:var(--ok)}
  .dc-rates.peak .dc-rates-kind{color:var(--warn)}
  .dc-rate{display:flex;align-items:baseline;gap:12px;margin-top:7px;font-size:12.5px}
  .dc-rate-name{color:var(--muted);min-width:74px}
  .dc-rate-cell{color:var(--dim);font-variant-numeric:tabular-nums}
  .dc-rate-cell i{font-style:normal;opacity:.75;margin-right:3px}
  .dc-rate-cell b{color:var(--fg);font-weight:650}
  .dc-rates-note{margin-top:8px;font-size:11px;color:var(--dim)}
  </style>
</head>
<body>
<header>
  <img class="logo" src="/static/favicon.svg" width="28" height="28" alt="">
  <h1>Quota Panel</h1>
  <!-- The entry point to the history page, when that layer is on: the last thing in the header,
       flush right — the same slot the live panel's link takes on the history page, so the two
       pages put their only navigation in the same place. #feed owns the auto margin, so whatever
       follows it sits at the right edge. Hidden in the markup rather than at runtime: a link to a
       page whose whole content is "off" is worse than no link at all, and load() unhides it as
       soon as the server says the layer is on (a broken store included — that page prints the
       error and the fix). -->
  <!-- #feed repaints once a second, so it is deliberately NOT a live region: a screen reader
       would announce the countdown on every tick. It is the header's one number. -->
  <span class="muted" id="feed"></span>
  <!-- The switch between the two pages: one segmented control, the same shape as the clock's
       Local/UTC toggle. The page you are on is filled; the other is a quiet label you can leave
       for. Kept last in the header, after #feed (which owns the auto margin), so the entry point
       and the way back occupy the same slot on both pages. -->
  <span class="navseg" id="navToggle" role="group" aria-label="View" hidden>
    <span class="navseg-item on" aria-current="page">Dashboard</span>
    <a class="navseg-item" id="historyLink" href="/history">History</a>
  </span>
</header>

<main>
  <div class="strip" id="status-strip" hidden></div>
  <!-- The DeepSeek price clock. Hidden until /api/quota says the feature is on (the server's
       QUOTA_DEEPSEEK_CLOCK is the switch), the same way the history link waits for its flag: a
       disabled install must not show a bar that only says "off". The bar is a plain div, not a
       .card, so the account grid's own count stays true; the info half is its own button, and the
       notify switch and the chevron sit outside it. -->
  <div class="clock off" id="clock-bar" hidden>
    <button type="button" class="dc-head" id="clock" aria-expanded="false" aria-controls="clock-panel">
      <span class="dc-brand"><img class="dc-logo" src="/static/logos/deepseek.png" alt="" width="18" height="18">DeepSeek</span>
      <span class="dc-kind"><span class="dc-dot" aria-hidden="true"></span><span id="clock-kind">Off-peak · half price</span></span>
      <span class="dc-count" id="clock-count">–:––:––</span>
      <span class="dc-meta" id="clock-meta">left</span>
      <span class="dc-timeline" aria-hidden="true"><span class="dc-track" id="clock-mini"></span><span class="dc-now" id="clock-mini-now"></span></span>
    </button>
    <!-- The notify switch rides the bar, beside the day bar, so it is reachable without unwrapping
         the panel. It sits outside the expand button, so toggling it never opens or closes the panel. -->
    <label class="dc-notify" id="clock-notify-label" title="Notify me when the price switches">
      <input type="checkbox" id="clock-notify"><span class="dc-notify-word">Notify</span>
    </label>
    <span class="dc-hint" id="clock-hint" hidden></span>
    <button type="button" class="dc-chev" id="clock-chev" aria-expanded="false" aria-controls="clock-panel" aria-label="DeepSeek price windows"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6.5 8 10.5 12 6.5"/></svg></button>
  </div>
  <div class="clock-panel" id="clock-panel" hidden>
    <div class="dc-hero off" id="clock-hero">
      <p class="dc-badge"><span class="dc-dot" aria-hidden="true"></span><span id="clock-badge">Off-peak · half price</span></p>
      <p class="dc-big"><span id="clock-big">–:––:––</span><span class="dc-unit">left</span></p>
      <p class="dc-until"><span class="dc-arrow" aria-hidden="true">→</span><span id="clock-until"></span></p>
    </div>
    <div class="dc-windows">
      <div class="dc-wlabel">DeepSeek price windows · <span id="clock-zone-label">your time</span><span class="dc-daynote" id="clock-daynote" hidden></span></div>
      <div id="clock-windows-body"></div>
    </div>
    <div class="dc-strip">
      <div class="dc-timeline" aria-hidden="true"><div class="dc-track" id="clock-track"></div><div class="dc-now" id="clock-now"></div></div>
      <div class="dc-ticks" aria-hidden="true"><span>00</span><span>06</span><span>12</span><span>18</span><span>24</span></div>
    </div>
    <div class="dc-toolbar">
      <span class="dc-tz" id="clock-tz"></span>
      <span class="dc-toggle" role="group" aria-label="Timezone">
        <button type="button" data-zone="local">Local</button>
        <button type="button" data-zone="utc">UTC</button>
      </span>
    </div>
  </div>
  <div class="grid" id="grid"><div class="card waiting">Loading…</div></div>
</main>

<noscript>
  <div class="card waiting">This panel paints its data with JavaScript. The raw payload is at
    <a href="/api/quota">/api/quota</a>.</div>
</noscript>

<script>
'use strict';
const TICK_MS = 1000;            // countdown repaint
// One cadence, and it is the server's: QUOTA_POLL_SECONDS is how often the numbers are
// republished, and the header counts down to the next publication. These bounds mirror the
// 10..3600 the server validates its own config against.
const MIN_POLL_MS = 10000;
const MAX_POLL_MS = 3600000;
const RETRY_MS = 15000;             // a failed fetch is retried sooner than a whole cadence
const FRESH_MS = 900;               // how long the header mark turns after a payload lands
const SOON_MS = 24 * 3600 * 1000;   // a refill this close is worth noticing on the card
const FETCH_TIMEOUT_MS = 8000;      // below MIN_POLL_MS: a fetch must settle before the next one
const RELOAD_AFTER = 3;          // consecutive failed fetches before the page attempts a reload
const MAX_RELOADS = 3;           // …and never more than this many in one document

let data = null, clockSkew = 0, pollMs = 60000;   // clockSkew: display-only server offset
let lastOkAt = null, failStreak = 0, timer = null, inFlight = false;
let reloads = 0, lastError = '', reloadTimer = null;
let firstRender = true;          // the stagger belongs to the first paint, not to every poll
let nextFetchAt = null;          // client-clock instant of the next fetch; what the countdown counts to

const colorFor = p => p >= 90 ? 'hot' : p >= 70 ? 'warn' : '';

// The card's own state, hoisted to its edge: 'broken' / 'urgent' / 'watch' / ''. Derived from the
// same two thresholds as colorFor(), so the tint can never disagree with the bars it sits beside.
// A balance card is never 'urgent': money has no cap, so no percentage exists to cross.
function cardState(acc){
  if(acc.state !== 'ok') return 'broken';
  let worst = -1;
  for(const w of (acc.windows || [])){
    if((w.kind || 'window') === 'balance') continue;
    const p = numericPercent(w.percent);
    if(p !== null && p > worst) worst = p;
  }
  return worst >= 90 ? 'urgent' : worst >= 70 ? 'watch' : '';
}

// The status strip's one number: the highest percent this account publishes, or -1 when it
// publishes none. A missing percent is not 0 and not 100 — it is simply not pressure.
function worstPercent(acc){
  let worst = -1;
  for(const w of (acc.windows || [])){
    if((w.kind || 'window') === 'balance') continue;
    const p = numericPercent(w.percent);
    if(p !== null && p > worst) worst = p;
  }
  return worst;
}

// One line that answers "is anything about to run out?" before a single card is read. Built from
// the same payload the cards come from — no second fetch. Not a live region: it repaints each poll.
function setStatusStrip(accounts){
  const el = document.getElementById('status-strip');
  if(!el) return;
  if(!accounts.length){ el.hidden = true; return; }
  // A fully spent window is exhausted, not "approaching" it: the two used to share one bucket,
  // so a maxed-out monthly plan read as "approaching limits" while it was already spent. 100% is
  // the exhausted answer; 70-99% is the ramp before it. Money balances are deliberately not
  // counted — they have no percent, and their own card says "balance exhausted" at zero.
  let approaching = 0, exhausted = 0;
  for(const a of accounts){
    if(a.state !== 'ok') continue;
    const worst = worstPercent(a);
    if(worst >= 100) exhausted++;
    else if(worst >= 70) approaching++;
  }
  const failing = accounts.filter(a => a.state !== 'ok').length;
  let soonest = Infinity;
  for(const a of accounts){
    for(const w of (a.windows || [])){
      if((w.kind || 'window') === 'balance') continue;
      const at = Date.parse(w.resets_at);
      if(isNaN(at)) continue;
      const left = at - serverNow();
      if(left > 0 && left < soonest) soonest = left;
    }
  }
  const parts = [accounts.length + ' accounts'];
  if(exhausted) parts.push('<span class="bad">' + exhausted + ' exhausted</span>');
  if(approaching) parts.push('<span class="warn">' + approaching + ' approaching limits</span>');
  if(!exhausted && !approaching) parts.push('all within limits');
  if(failing) parts.push(failing + ' failing');
  if(isFinite(soonest)){
    const d = Math.floor(soonest / 86400000);
    const h = Math.floor((soonest % 86400000) / 3600000);
    const m = Math.floor((soonest % 3600000) / 60000);
    parts.push('next reset in <b>' + (d ? d + 'd ' + h + 'h' : h ? h + 'h ' + m + 'm' : m + 'm') + '</b>');
  }
  el.innerHTML = parts.join(' · ');
  el.hidden = false;
}

function esc(s){ return String(s === null || s === undefined ? '' : s)
  .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

// Font Awesome Free 7.3.1 solid, inlined: the icons are CC BY 4.0 (Fonticons, Inc.), and the
// paths are pasted rather than fetched so the page keeps making no request of its own. `clock`
// marks when the numbers were published, `rotate` the refresh cadence, and `warning`/`down` the
// two degraded feed states that used to be the emoji U+26A0 and U+26D4. All four inherit
// currentColor, so they follow the state colour like the text beside them.
//
// The emoji were the problem: they render as whatever colour font the viewer happens to have
// installed, which is exactly what #feed.stale/--warn and #feed.down/--hot exist to control, so a
// red warning triangle could sit in amber text. They are also two bytes of surprise in a header
// whose other mark was already SVG.
//
// These three marks are the only reason innerHTML is used outside cardHtml(). Safe by
// construction: what is concatenated around them is either a fixed phrase from updateText()
// (the words updating/retrying/now and a number of seconds) or an escaped error through esc() —
// no provider-supplied text reaches any of the three call sites.
const ICON = {
  rotate: '<span class="ic" aria-hidden="true"><svg viewBox="0 0 512 512"><path d="M480.1 192l7.9 0c13.3 0 24-10.7 24-24l0-144c0-9.7-5.8-18.5-14.8-22.2S477.9 .2 471 7L419.3 58.8C375 22.1 318 0 256 0 127 0 20.3 95.4 2.6 219.5 .1 237 12.2 253.2 29.7 255.7s33.7-9.7 36.2-27.1C79.2 135.5 159.3 64 256 64 300.4 64 341.2 79 373.7 104.3L327 151c-6.9 6.9-8.9 17.2-5.2 26.2S334.3 192 344 192l136.1 0zm29.4 100.5c2.5-17.5-9.7-33.7-27.1-36.2s-33.7 9.7-36.2 27.1c-13.3 93-93.4 164.5-190.1 164.5-44.4 0-85.2-15-117.7-40.3L185 361c6.9-6.9 8.9-17.2 5.2-26.2S177.7 320 168 320L24 320c-13.3 0-24 10.7-24 24L0 488c0 9.7 5.8 18.5 14.8 22.2S34.1 511.8 41 505l51.8-51.8C137 489.9 194 512 256 512 385 512 491.7 416.6 509.4 292.5z"/></svg></span>',
  warning: '<span class="ic" aria-hidden="true"><svg viewBox="0 0 512 512"><path d="M256 0c14.7 0 28.2 8.1 35.2 21l216 400c6.7 12.4 6.4 27.4-.8 39.5S486.1 480 472 480L40 480c-14.1 0-27.2-7.4-34.4-19.5s-7.5-27.1-.8-39.5l216-400c7-12.9 20.5-21 35.2-21zm0 352a32 32 0 1 0 0 64 32 32 0 1 0 0-64zm0-192c-18.2 0-32.7 15.5-31.4 33.7l7.4 104c.9 12.5 11.4 22.3 23.9 22.3 12.6 0 23-9.7 23.9-22.3l7.4-104c1.3-18.2-13.1-33.7-31.4-33.7z"/></svg></span>',
  down: '<span class="ic" aria-hidden="true"><svg viewBox="0 0 512 512"><path d="M256 512a256 256 0 1 0 0-512 256 256 0 1 0 0 512zM167 167c9.4-9.4 24.6-9.4 33.9 0l55 55 55-55c9.4-9.4 24.6-9.4 33.9 0s9.4 24.6 0 33.9l-55 55 55 55c9.4 9.4 9.4 24.6 0 33.9s-24.6 9.4-33.9 0l-55-55-55 55c-9.4 9.4-24.6 9.4-33.9 0s-9.4-24.6 0-33.9l55-55-55-55c-9.4-9.4-9.4-24.6 0-33.9z"/></svg></span>',
};

// clockSkew is (server clock - client clock), measured once per fetch. It exists ONLY to read
// server-side stamps correctly (the age of the data, the reset countdowns) and deliberately plays
// no part in scheduling: the refresh interval is the page's own, derived from `poll_seconds`, so a
// missing or wrong `now` cannot bend it. Before this split, the same value also positioned the
// next fetch, and that is how a clock hiccup became a 3-second countdown.
// clientNow + skew. A reset stamp is on the server's clock, so the skew belongs on the clock —
// the old code added it to the stamp instead, which doubled the error in the opposite
// direction: a client 5 minutes slow was told a window reset in 20 minutes when 10 remained.
function serverNow(){ return Date.now() + clockSkew; }

// The age of the DATA, not of the last successful fetch: /api/quota answers 200 with every
// account in error, so an HTTP success says nothing about whether the numbers are moving.
// serverNow() is the server's clock, so `serverNow() - generated_at` is that age directly.
function dataAge(){
  const fallback = lastOkAt === null ? 0 : Math.round((Date.now() - lastOkAt)/1000);
  if(!data || !data.generated_at) return fallback;
  const born = Date.parse(data.generated_at);
  if(isNaN(born)) return fallback;
  return Math.max(0, Math.round((serverNow() - born)/1000));
}

function isStale(){
  const cadence = (data && data.poll_seconds) || 60;
  return dataAge() > cadence * 3;
}

// The server's publication cadence in ms: `poll_seconds`, clamped to the same 10..3600 the
// server validates its config against. The page's refresh rate is this, and only this — the
// numbers cannot move more often than the server republishes them, so the page follows that
// clock instead of running a second one of its own.
function dataCadenceMs(){
  const declared = (data && data.poll_seconds) || 60;
  return Math.min(MAX_POLL_MS, Math.max(MIN_POLL_MS, declared * 1000));
}

// The client's wait is the configured cadence, verbatim -- not a margin on top of it. The margin
// that prevents a poll landing fractionally before the publication it is waiting for belongs on
// the server's side of the race (see poller_loop), where it costs the user nothing: he asked for a
// 30-second panel and gets one, and the header can print his own number truthfully.
function nextWaitMs(){
  return dataCadenceMs();
}

// The header's one number: when the page next asks the server, which is when the numbers are
// expected to change. It used to print two intervals and the data's age — three numbers, two of
// them intervals of a machine nobody asked about, which is how "every 60s, checked every 30s"
// ended up on a page that visibly moved once a minute.
function secondsToUpdate(){
  if(nextFetchAt === null) return null;
  return Math.max(0, Math.ceil((nextFetchAt - Date.now())/1000));
}

function updateText(verb){
  const s = secondsToUpdate();
  if(s === null) return 'waiting for the first update';
  if(s <= 0) return verb + ' now…';
  // Phrased with the literal "in N seconds" kept contiguous: the smoke test asserts the served
  // page contains it, because a countdown that stopped saying the unit was one of the ways the
  // header used to lie.
  return s === 1 ? `${verb} in 1 second` : `${verb} in ${s} seconds`;
}

function countdown(iso){
  if(!iso) return '';
  const target = Date.parse(iso);
  if(isNaN(target)) return '';
  let s = Math.floor((target - serverNow())/1000);
  if(s <= 0) return 'resetting…';
  const d = Math.floor(s/86400); s -= d*86400;
  const h = Math.floor(s/3600); s -= h*3600;
  const m = Math.floor(s/60); const sec = s - m*60;
  if(d) return `resets in ${d}d ${h}h`;
  if(h) return `resets in ${h}h ${m}m`;
  if(m) return `resets in ${m}m ${sec}s`;
  return `resets in ${sec}s`;
}

function fmtNum(v){
  // Total on purpose: a field of the wrong JS type used to throw inside render(), and a throw
  // there cleared the whole grid. A numeric string is accepted rather than called unreadable —
  // "98.5" from a provider is a number, not an error.
  const n = typeof v === 'number' ? v : Number(v);
  if(v === null || v === undefined || v === '' || !isFinite(n)) return '—';
  if(Math.abs(n - Math.round(n)) < 0.005) return String(Math.round(n));
  return n.toFixed(2);
}

// A percent that is missing, or is not a number at all, is not 0% — and it is not 100% either.
// `width:NaN%` is an invalid declaration, so the bar fell back to a full-width green fill next
// to the label "—%": a shape no reading supports. Clamp once, and use that value everywhere.
function numericPercent(v){
  const n = typeof v === 'number' ? v : Number(v);
  if(v === null || v === undefined || v === '' || !isFinite(n)) return null;
  return Math.min(100, Math.max(0, n));
}

const CUR_SYMBOL = {USD:'$', CNY:'¥', EUR:'€', GBP:'£', JPY:'¥'};

// A money balance has no cap, so there is no percentage to draw: the number IS the
// reading. Never render 0% here — an exhausted balance and an unread one look
// identical in a bar, and one of them means "you cannot make calls right now".
function renderBalance(w){
  const parsed = (w.amount === null || w.amount === undefined || w.amount === '') ? null : Number(w.amount);
  // A non-numeric amount is unreadable — not zero, and never the string "NaN".
  const amount = parsed === null || !isFinite(parsed) ? null : parsed;
  const cur = w.currency || 'USD';
  const sym = CUR_SYMBOL[cur] || '';
  const exhausted = amount !== null && amount <= 0;
  // Built unescaped: this string is escaped once, where it is interpolated. Escaping the
  // currency here and again there printed literal "&lt;i&gt;USD&lt;/i&gt;" to the user.
  const shown = amount === null ? '—'
    : (sym ? sym + amount.toFixed(2) : amount.toFixed(2) + ' ' + cur);
  let html = `<div class="bal">
      <div class="bal-amount${exhausted ? ' empty' : ''}">${esc(shown)}${
        sym ? `<span class="cur">${esc(cur)}</span>` : ''}</div>`;
  if(amount === null){
    html += `<div class="bal-note">${esc(w.note || 'no reading')}</div>`;
  } else if(exhausted){
    html += `<div class="bal-note">${esc(w.note || 'balance exhausted')}</div>`;
  } else if(w.note){
    html += `<div class="bal-note">${esc(w.note)}</div>`;
  }
  const ex = w.extra || {};
  const bits = [];
  if(ex.total_credits !== undefined) bits.push(`${fmtNum(ex.total_credits)} credited`);
  if(ex.total_usage !== undefined) bits.push(`${fmtNum(ex.total_usage)} spent`);
  if(ex.usage_daily !== undefined) bits.push(`today ${fmtNum(ex.usage_daily)}`);
  if(ex.reserved_usd !== undefined) bits.push(`${fmtNum(ex.reserved_usd)} reserved`);
  if(ex.voucher_balance !== undefined) bits.push(`voucher ${fmtNum(ex.voucher_balance)}`);
  if(ex.cash_balance !== undefined) bits.push(`cash ${fmtNum(ex.cash_balance)}`);
  if(ex.granted_balance !== undefined) bits.push(`granted ${fmtNum(ex.granted_balance)}`);
  if(ex.topped_up_balance !== undefined) bits.push(`topped up ${fmtNum(ex.topped_up_balance)}`);
  if(bits.length) html += `<div class="bal-note">${esc(bits.join(' · '))}</div>`;
  if(w.resets_at) html += `<div class="reset" data-reset="${esc(w.resets_at)}">${countdown(w.resets_at)}</div>`;
  html += `</div>`;
  return html;
}

function setFeed(){
  const el = document.getElementById('feed');
  if(lastOkAt === null){
    // Never tell the user "Loading…" forever: if the very first fetch failed, say so.
    if(!lastError){ el.textContent = ''; el.className = 'muted'; return; }
    el.innerHTML = ICON.down + ' no data yet — ' + esc(lastError);
    el.className = 'muted down';
    return;
  }
  const age = dataAge();
  const tail = lastError ? ` — ${lastError}` : '';
  const stale = isStale();
  // The mark carries the state and is the only thing that changes with it: colour alone is easy
  // to miss in a screenshot or a terminal. The phrase itself never becomes arithmetic — one
  // number, counting down to the next update.
  if(failStreak === 0 && !stale){
    el.innerHTML = ICON.rotate + ' ' + updateText('updating');
    el.className = 'muted' + (Date.now() - lastOkAt < FRESH_MS ? ' fresh' : '');
  } else if(failStreak < RELOAD_AFTER){
    // A payload that parsed fine but stopped moving is not a healthy feed: /api/quota answers
    // 200 with every account in error, so HTTP success alone says nothing about the data.
    el.innerHTML = ICON.warning + ' ' + updateText(failStreak ? 'retrying' : 'updating')
                 + ` (${stale ? 'data stale' : 'reconnecting'}, data ${age}s old)` + esc(tail);
    el.className = 'muted stale';
  } else {
    el.innerHTML = ICON.down + ' feed down — ' + updateText('retrying')
                 + ` (data ${age}s old)` + esc(tail);
    el.className = 'muted down';
  }
}

// One card's markup. It returns a string so that a throw cannot leave the grid half-built:
// render() clears the grid first, so an exception in here used to blank the page while the
// indicator still claimed "auto-refresh every 30s", and that same exception escaped load() as an
// unhandled rejection — the count then oscillated 0→1 and the reload path was never reached.
//
// setFeed() sets innerHTML too, for the same reason: its mark is an SVG. The only outside value
// it interpolates is lastError, which is escaped with esc() at every site — the branches used to
// assign textContent, so switching them without escaping would have made a server-supplied error
// string executable markup.
//
// Why setting innerHTML from this string is safe: every value that originates outside this file
// (label, plan, account_name, error, notes, resets_at, currency, state, logo) is passed through
// esc() at the point of interpolation, and esc() escapes &, <, > and ". The only unescaped
// interpolations are the outputs of fmtNum(), numericPercent() and colorFor(), which can only
// produce digits, "-", "." and the fixed literals ''/'warn'/'hot'. Attribute contexts are all
// double-quoted, and src= values are appended to a root-relative path, so a config-supplied
// logo cannot become an off-origin or javascript: URL.
function cardHtml(acc, stale){
  const ok = acc.state === 'ok';
  // The mark is keyed off the provider the server resolved, falling back to the
  // neutral glyph — a missing logo file must never render a broken-image box.
  const mark = acc.logo || '_fallback.svg';
  // The pill says one thing: the state of the reading on this card. Nothing about how the
  // adapter that produced it was written — that verdict was a maintainer's note in a reader's
  // header. `live` is claimed only while the payload this card came from is still current, so a
  // poller that quietly stopped republishing cannot leave a wall of green lights behind it. A
  // failure carries the state the server gave, which is what tells "the key was rejected" apart
  // from "the provider changed its shape".
  const pill = ok ? (stale ? 'stale' : 'live') : acc.state;
  const pillClass = ok ? (stale ? 'old' : 'ok') : 'bad';
  const pillTitle = ok
    ? (stale
        ? `the server has not republished for ${dataAge()}s — these are its last numbers`
        : 'read from the provider in the current poll')
    : (acc.error || acc.state);
  let html = `<div class="card-head">
      <div class="card-id">
        <img class="mark" src="/static/logos/${esc(mark)}" width="20" height="20" alt="" aria-hidden="true">
        <div style="min-width:0">
          <h2 class="label">${esc(acc.label)}</h2>
          <div class="plan">${esc(acc.plan || acc.provider)}${acc.account_name ? ' · ' + esc(acc.account_name) : ''}</div>
        </div>
      </div>
      <span class="pill ${pillClass}" title="${esc(pillTitle)}"><span class="dot" aria-hidden="true"></span>${esc(pill)}</span>
    </div>`;
  if(!ok){
    // http_status is kept separate from state by the server precisely so a card can say "the
    // provider answered 500" without inventing a reason; it was served and never rendered.
    html += `<div class="err">${esc(acc.error || acc.state)}${
      acc.http_status ? esc(' (HTTP ' + acc.http_status + ')') : ''}</div>`;
    return html;
  }
  for(const w of (acc.windows || [])){
    if((w.kind || 'window') === 'balance'){
      html += renderBalance(w);
      continue;
    }
    const p = numericPercent(w.percent);
    const label = p === null ? (w.note || '—') : fmtNum(p) + '%';
    html += `<div class="win" data-reset="${esc(w.resets_at || '')}">
        <div class="win-top"><span class="win-name">${esc(w.label)}</span><span class="win-val">${esc(label)}</span></div>`;
    if(p !== null){
      html += `<div class="bar"><div class="fill ${colorFor(p)}" style="width:${p}%"></div></div>`;
    }
    // The note is printed exactly once, on the detail line: it used to be dropped whenever a
    // percent was present (except the magic string "credits") and printed twice when it was not.
    // The countdown gets a span of its own so it can carry the emphasis: tick() rewrites that
    // span once a second, and the used/cap numbers beside it are never re-assembled by hand.
    const cd = countdown(w.resets_at);
    const tail = [];
    if(w.used !== null && w.used !== undefined && w.cap) tail.push(`${fmtNum(w.used)} / ${fmtNum(w.cap)}`);
    if(w.note && p !== null) tail.push(String(w.note));
    const line = (cd ? `<span class="when">${esc(cd)}</span>` : '')
      + (tail.length ? `<span class="rest">${cd ? ' · ' : ''}${esc(tail.join(' · '))}</span>` : '');
    if(line) html += `<div class="reset">${line}</div>`;
    html += `</div>`;
  }
  // A DeepSeek card also carries DeepSeek's own per-token API rates, so the reader can see what
  // the model costs as well as the balance left to spend on it. Only here: a reseller's card
  // bills at the reseller's prices, not DeepSeek's, so the rates would be wrong on it.
  if(dcEnabled && acc.provider === 'deepseek'){
    html += dcRatesHtml();
  }
  const t = acc.totals || {};
  if(t.requests || t.tokens_in){
    html += `<div class="totals">${fmtNum(t.requests || 0)} requests · in ${fmtNum(t.tokens_in || 0)} / out ${fmtNum(t.tokens_out || 0)} tokens${t.success_rate !== undefined && t.success_rate !== null ? ' · ' + fmtNum(t.success_rate) + '% success' : ''}</div>`;
  }
  if(acc.period_end){
    // The server passes a provider-supplied string through when it merely looks ISO-ish, so an
    // unparseable one used to print "period ends Invalid Date" as if it were a fact.
    const end = Date.parse(acc.period_end);
    // The day the plan's month ends is what a reader plans around, so the date carries the same
    // emphasis as a countdown, and turns amber inside its last three days.
    const soon = !isNaN(end) && (end - serverNow()) < SOON_MS * 3;
    html += `<div class="reset${soon ? ' soon' : ''}">period ends ${isNaN(end)
      ? esc(acc.period_end) : `<span class="when">${esc(new Date(end).toLocaleString())}</span>`}</div>`;
  }
  return html;
}

function render(){
  const grid = document.getElementById('grid');
  if(!data){ return; }
  const accounts = data.accounts || [];
  // One freshness reading for the whole paint: every card here came out of the same payload, so
  // none of them can be fresher than it is.
  const stale = isStale();
  setStatusStrip(accounts);
  grid.classList.toggle('first', firstRender);
  grid.innerHTML = '';
  if(!accounts.length){
    grid.innerHTML = '<div class="card waiting">Waiting for the first provider poll…</div>';
  }
  for(const acc of accounts){
    const el = document.createElement('div');
    el.className = 'card ' + cardState(acc);
    try{
      // Every interpolated value in cardHtml passes through esc() (label/plan/error/notes come
      // from the local config and provider APIs), so no raw remote string is parsed as markup.
      el.innerHTML = cardHtml(acc, stale);
    }catch(e){
      // One malformed field must cost one card, not the whole grid — and the failure has to be
      // visible, because a blank panel under a green indicator is the worst possible outcome.
      el.innerHTML = `<h2 class="label">${esc(acc.label || acc.id || 'account')}</h2>
          <div class="err">could not render this card: ${esc((e && e.message) || String(e))}</div>`;
    }
    grid.appendChild(el);
  }
  firstRender = false;
  setFeed();
}

function tick(){
  // Window cards put data-reset on the wrapper (.win) and the text lives in a .reset child;
  // balance cards put it on the .reset element itself. Only the first shape used to be
  // matched, so every money card's countdown froze at render time while the window countdowns
  // beside it kept ticking.
  for(const el of document.querySelectorAll('[data-reset]')){
    const iso = el.getAttribute('data-reset');
    const node = el.classList.contains('reset') ? el : el.querySelector('.reset');
    if(!node || !iso) continue;
    const cd = countdown(iso);
    if(!cd) continue;
    const when = node.querySelector('.when');
    if(when){
      when.textContent = cd;
    }else{
      // A .reset rendered without one -- markup from before the split -- still gets its line.
      const parts = node.textContent.split(' · ');
      node.textContent = cd + (parts.length > 1 ? ' · ' + parts.slice(1).join(' · ') : '');
    }
    // The imminent-refill class lives here, not at render time, so a card left open overnight is
    // amber by the time today's refill is an hour away.
    const left = Date.parse(iso) - serverNow();
    node.classList.toggle('soon', isFinite(left) && left > 0 && left < SOON_MS);
  }
  dcRender();
  setFeed();
}

// One clock, and it is the server's: the page polls one cadence after its own last fetch, so the
// interval between two requests is always pollMs — slightly longer, never shorter, than the
// server's republication period.
//
// What used to be here counted down to a *stamp-derived* instant and, when a fetch happened to
// arrive before the next publication landed, armed itself 2.5s out. Nothing reset it to the
// cadence unless a fresh stamp appeared first, so the header settled into counting 3, 2, 1
// forever — a countdown that was accurate about a timer that should never have been set. The
// alignment bought one request per publication; it cost a page that reported garbage as soon as
// the timing drifted, which is a bad trade for a dashboard.
function scheduleNext(overrideMs){
  if(timer) clearTimeout(timer);
  const wait = overrideMs || nextWaitMs();
  nextFetchAt = Date.now() + wait;
  timer = setTimeout(load, wait);
}

async function load(){
  // Collapse overlapping triggers (startup + visibilitychange + focus can all fire
  // within milliseconds of each other and used to produce three identical requests).
  if(inFlight) return;
  inFlight = true;
  // A fetch that never settles used to latch `inFlight` forever: every later load() returned at
  // the line above, auto-refresh stopped, `failStreak` never moved, and nothing on the page said
  // so. Bound it, so the catch path always runs and the latch is always released.
  const ctrl = new AbortController();
  const bail = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT_MS);
  try{
    const res = await fetch('/api/quota?t=' + Date.now(), {cache:'no-store', signal:ctrl.signal});
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const fresh = await res.json();
    data = fresh;
    // The history entry point follows one flag and no other: `enabled`. A default install has
    // the layer off, so the page must not offer a link that can only say "off" because of a
    // setting this reader never made. But an enabled store that failed to open is exactly when
    // someone has to reach that page — it is where the live error and the fix are printed — so
    // the link must NOT wait for `!history.error`. Withholding it there strands the reader on a
    // panel that looks fine with no way to find out why history is empty.
    const history = fresh.history || {};
    // The switch is the entry point to the history layer and is drawn only when that layer is on:
    // with history off there is nowhere to go. Tied to `enabled` alone — a store that is enabled
    // but will not open still needs its page, which prints the live error and the fix.
    const navToggle = document.getElementById('navToggle');
    if(navToggle) navToggle.hidden = !history.enabled;
    // The DeepSeek price clock follows one server flag and no other. Absent means on, so a
    // server that predates the field never silently hides it; the switch is QUOTA_DEEPSEEK_CLOCK.
    const dcCfg = fresh.deepseek_clock;
    dcEnabled = dcCfg ? dcCfg.enabled !== false : true;
    const clockBar = document.getElementById('clock-bar');
    if(clockBar) clockBar.hidden = !dcEnabled;
    if(!dcEnabled) dcClose();
    // Re-apply the restored wrap state once the flag is known: at init the panel is held closed
    // because dcEnabled starts false, so a remembered "open" would otherwise be lost until the
    // next click, which would then read as a close.
    dcApplyOpen();
    if(dcEnabled) dcRender();
    // Display only — never scheduling. No fallback to `generated_at`: that stamp is older than
    // the response by the age of the data, so using it as a clock offset would subtract the data's
    // own age and make every payload look permanently fresh (dataAge() would read 0 and isStale()
    // could never fire). A server that sends no `now` gets no offset.
    const serverClock = fresh.now;
    const skewAt = serverClock ? Date.parse(serverClock) : NaN;
    clockSkew = isNaN(skewAt) ? 0 : skewAt - Date.now();
    lastOkAt = Date.now();
    failStreak = 0;
    lastError = '';
    if(reloadTimer){ clearTimeout(reloadTimer); reloadTimer = null; }
    pollMs = dataCadenceMs();
    scheduleNext();
    render();
  }catch(e){
    failStreak++;
    lastError = (e && e.name === 'AbortError')
      ? `no answer within ${Math.round(FETCH_TIMEOUT_MS/1000)}s`
      : ((e && e.message) || 'fetch failed');
    // Keep the last good render on screen and paint the failure state BEFORE deciding whether to
    // reload — the reload branch used to clear failStreak first, which made the "feed down" state
    // unreachable in any visible tab. setFeed() is called explicitly because render() returns
    // early when no payload has ever arrived.
    render();
    setFeed();
    // A failure retries sooner than a whole cadence, but the floor is a real interval and the
    // countdown shows exactly this value — a transient error must not turn the header into a
    // single-digit spinner.
    pollMs = dataCadenceMs();
    const backoff = Math.max(pollMs/3, Math.min(pollMs, RETRY_MS));
    scheduleNext(backoff);
    // A reload is bounded, backed off, and never a loop: the failure this page is built to
    // survive is the server being gone, and that is exactly when reloading cannot help — the old
    // bare location.reload() stormed forever, said nothing, and discarded the last good render.
    if(failStreak >= RELOAD_AFTER && document.visibilityState === 'visible'){
      if(reloads >= MAX_RELOADS){
        lastError = `${lastError} (reloads exhausted — this page will keep retrying the feed)`;
        setFeed();
      }else{
        reloads++;
        setFeed();
        reloadTimer = setTimeout(() => location.reload(), reloads * 5000);
      }
    }
  }finally{
    clearTimeout(bail);
    inFlight = false;
  }
}

// Background tabs get their timers throttled by the browser, so a visible page can
// show numbers minutes old. Refresh immediately whenever we come back to the front.
document.addEventListener('visibilitychange', () => {
  if(document.visibilityState === 'visible') load();
});
window.addEventListener('focus', () => load());
window.addEventListener('online', () => load());

// ------------------------------------------------------------ DeepSeek price clock
// DeepSeek charges half price off-peak. The peak windows are fixed in UTC (01:00-04:00 and
// 06:00-10:00) and apply only on weekdays in Beijing time, excluding China's statutory public
// holidays; everything else — every Beijing Saturday and Sunday, and each statutory holiday in
// full — is off-peak. This is arithmetic on the reader's own clock, so it keeps ticking between
// polls; the payload carries only the on/off switch.
//
// The statutory days are computed here from the lunar calendar rather than transcribed from the
// State Council's annual notice, and computed on the *reader's* clock rather than sent: a window
// of years from the server could only ever be right for a reader in the server's year. A make-up
// workday that lands on a weekend stays off-peak — DeepSeek's rule is "weekends are off in full",
// not "the days China calls workdays are peak".

// is half of peak, so the peak column is derived and the two cannot drift apart. The numbers are

const DC_RATES = [

const DC_LUNAR_EPOCH = Date.UTC(1900, 0, 31);   // lunar 1900-01-01, 正月初一

function dcLeapMonth(year){ return DC_LUNAR_INFO[year - 1900] & 0xf; }
function dcLeapDays(year){
  if(!dcLeapMonth(year)) return 0;
  return (DC_LUNAR_INFO[year - 1900] & 0x10000) ? 30 : 29;
}
function dcMonthDays(year, month){
  return (DC_LUNAR_INFO[year - 1900] & (0x10000 >> month)) ? 30 : 29;
}
function dcLunarYearDays(year){
  let total = 348;
  for(let bit = 0x8000; bit >= 0x10; bit >>= 1){
    if(DC_LUNAR_INFO[year - 1900] & bit) total += 1;
  }
  return total + dcLeapDays(year);
}
// The solar instant of a lunar date. The leap month follows its normal twin, hence the isLeap term.
function dcLunarToSolar(lunarYear, lunarMonth, lunarDay, isLeap){
  let offset = 0;
  for(let year = 1900; year < lunarYear; year++) offset += dcLunarYearDays(year);
  const leap = dcLeapMonth(lunarYear);
  for(let month = 1; month < lunarMonth; month++){
    offset += dcMonthDays(lunarYear, month);
    if(leap && month === leap) offset += dcLeapDays(lunarYear);
  }
  if(isLeap) offset += dcMonthDays(lunarYear, lunarMonth);
  offset += lunarDay - 1;
  return new Date(DC_LUNAR_EPOCH + offset * DC_DAY_MS);
}
// Qingming is a solar term, on April 4 or 5: int((year mod 100) * 0.2422 + C) - int((year mod 100) / 4),
// with C = 5.59 for the 20th century and 4.81 for the 21st.
function dcQingmingDay(year){
  const c = { 20: 5.59, 21: 4.81 }[Math.floor(year / 100) + 1];
  return c === undefined ? null
       : Math.floor((year % 100) * 0.2422 + c) - Math.floor((year % 100) / 4);

// The 13 statutory days: New Year's Day; Spring Festival eve and days one to three; Qingming;
// Labour Day (May 1-2); Dragon Boat; Mid-Autumn; National Day (October 1-3).
function dcStatutoryHolidays(year){
  const iso = d => d.toISOString().slice(0, 10);
  const days = new Set();
  const solar = (month, day) => days.add(iso(new Date(Date.UTC(year, month - 1, day))));
  solar(1, 1); solar(5, 1); solar(5, 2); solar(10, 1); solar(10, 2); solar(10, 3);
  const qingming = dcQingmingDay(year);
  if(qingming) solar(4, qingming);
  const spring = dcLunarToSolar(year, 1, 1, false);
  for(let k = -1; k <= 2; k++) days.add(iso(new Date(spring.getTime() + k * DC_DAY_MS)));
  days.add(iso(dcLunarToSolar(year, 5, 5, false)));     // 端午
  days.add(iso(dcLunarToSolar(year, 8, 15, false)));    // 中秋
  return days;
}
const dcHolidayYears = new Map();

  if(!dcHolidayYears.has(year)) dcHolidayYears.set(year, dcStatutoryHolidays(year));
  return dcHolidayYears.get(year);
}

  const beijing = new Date(date.getTime() + 8 * 3600000);
  return beijing.getUTCDay() === 0 || beijing.getUTCDay() === 6;

// A statutory holiday is a Chinese civil date, so an instant is judged by its Beijing date.
function dcIsHoliday(date){
  const beijing = new Date(date.getTime() + 8 * 3600000);
