  if(year < 1900 || year > 2100) return false;          // outside the lunar table
  return dcHolidaySet(year).has(beijing.toISOString().slice(0, 10));
}

function dcOffPeakAllDay(date){
  // Every Beijing weekend is off-peak: the official rule carries no start date, so the reference's
  // 2026-08-22 weekend gate is dropped. The clock draws now and forward and dcWindowStart looks
  // back only ten days, so no date before that change is ever rendered.
  return dcIsHoliday(date) || dcIsBeijingWeekend(date);
}
function dcKindAt(date){
  if(dcOffPeakAllDay(date)) return 'off';
  const m = date.getUTCHours() * 60 + date.getUTCMinutes();
  return DC_PEAK_UTC.some(function(w){ return m >= w[0] && m < w[1]; }) ? 'peak' : 'off';
}
function dcIsSwitch(date){
  const m = date.getUTCHours() * 60 + date.getUTCMinutes();
  return DC_SWITCH_MINUTES.indexOf(m) !== -1 && !dcOffPeakAllDay(date);
}
// The next few price changes as absolute instants. Switch minutes inside a gated weekend are
// skipped, so the walk rolls across a weekend into Monday morning.
function dcNextSwitches(now, count){
  const dayStart = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  const out = [];
  let day = 0, i = 0;
  while(out.length < count){
    const instant = dayStart + day * 86400000 + DC_SWITCH_MINUTES[i] * 60000;
    const cand = new Date(instant);
    if(instant > now.getTime() && dcIsSwitch(cand)) out.push({ date:cand, kind:dcKindAt(cand) });
    if(++i >= DC_SWITCH_MINUTES.length){ i = 0; day++; }
  }
  return out;
}
// The instant the window you are in began. Ten days of candidates always contain it: the
// longest run without a switch is the Friday-evening-to-Monday-morning weekend itself.
function dcWindowStart(now){
  const dayStart = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
  let best = null;
  for(let day = -10; day <= 0; day++){
    for(let i = 0; i < DC_SWITCH_MINUTES.length; i++){
      const instant = dayStart + day * 86400000 + DC_SWITCH_MINUTES[i] * 60000;
      const cand = new Date(instant);
      if(instant <= now.getTime() && dcIsSwitch(cand) && (best === null || instant > best.getTime()))
        best = cand;
    }
  }
  return best || new Date(now.getTime() - 86400000);
}
function dcUtcWindow(now){
  const next = dcNextSwitches(now, 1)[0];
  return { kind:dcKindAt(now), nextKind:next.kind, end:next.date };
}
// A day of windows, opening with the one you are in, built from the switch instants rather than
// the display bar so a window straddling local midnight stays a single row.
function dcWindowList(now, count){
  const upcoming = dcNextSwitches(now, count);
  let start = dcWindowStart(now), kind = dcKindAt(now);
  const out = [];
  for(let i = 0; i < count; i++){
    out.push({ start:start, end:upcoming[i].date, kind:kind, current:i === 0 });
    start = upcoming[i].date; kind = upcoming[i].kind;
  }
  return out;
}
function dcDispOffset(){ return dcZone === 'utc' ? 0 : -new Date().getTimezoneOffset(); }
// Where "now" sits on the 24-hour bar, in display minutes. Both the mini and the full timeline use
// it; the minutes term is load-bearing — without it the marker sticks to the top of the hour.
function dcMarkerPct(date){
  const minutes = date.getUTCHours() * 60 + date.getUTCMinutes() + date.getUTCSeconds() / 60;
  return ((minutes + dcDispOffset() + 1440) % 1440) / 1440 * 100;
}
function dcTzName(){
  try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || 'local time'; }
  catch(e){ return 'local time'; }
}
function dcOffsetLabel(){
  const m = dcDispOffset(), sign = m >= 0 ? '+' : '−', a = Math.abs(m);
  return 'GMT' + sign + Math.floor(a / 60) + (a % 60 ? ':' + String(a % 60).padStart(2, '0') : '');
}
function dcBuildFormatters(){
  const base = dcZone === 'utc'
    ? { hour:'2-digit', minute:'2-digit', timeZone:'UTC' }
    : { hour:'2-digit', minute:'2-digit' };
  dcFmtTime = new Intl.DateTimeFormat(undefined, base);
  dcFmtTimeZone = new Intl.DateTimeFormat(undefined, Object.assign({}, base, { timeZoneName:'short' }));
  dcFmtDay = new Intl.DateTimeFormat(undefined, Object.assign({ weekday:'short' }, base));
  dcFmtDayZone = new Intl.DateTimeFormat(undefined,
    Object.assign({}, { weekday:'short' }, base, { timeZoneName:'short' }));
}
function dcDayKey(date){
  return dcZone === 'utc'
    ? date.getUTCFullYear() * 10000 + (date.getUTCMonth() + 1) * 100 + date.getUTCDate()
    : date.getFullYear() * 10000 + (date.getMonth() + 1) * 100 + date.getDate();
}
function dcRangeLabel(start, end, todayKey){
  if(dcDayKey(start) !== dcDayKey(end))
    return dcFmtDay.format(start) + ' – ' + dcFmtDay.format(end);
  // A row outside today is on a future day — a weekend or a public holiday can push the next
  // windows days out — so it carries its weekday. Only today's rows stay bare, reading as
  // "later today" rather than "sometime".
  return dcDayKey(start) === todayKey
    ? dcFmtTime.format(start) + ' – ' + dcFmtTime.format(end)
    : dcFmtDay.format(start) + ' – ' + dcFmtTime.format(end);
}
function dcClock(total){
  const s = Math.max(0, Math.floor(total));
  const days = Math.floor(s / 86400), rest = s % 86400;
  const hms = String(Math.floor(rest / 3600)).padStart(2, '0') + ':'
    + String(Math.floor((rest % 3600) / 60)).padStart(2, '0') + ':' + String(rest % 60).padStart(2, '0');
  // A normal window stays HH:MM:SS as in the reference; a weekend or a public holiday can stretch
  // one to days, and "148:41:58" reads worse than "6d 04:41:58".
  return days ? days + 'd ' + hms : hms;
}
function dcAway(ms){
  const mins = Math.max(0, Math.floor(ms / 60000)), h = Math.floor(mins / 60);
  return h ? h + 'h ' + (mins % 60) + 'm' : mins + 'm';
}
function dcDuration(ms){
  const mins = Math.max(0, Math.round(ms / 60000)), h = Math.floor(mins / 60), r = mins % 60;
  return !h ? r + 'm' : (r ? h + 'h ' + r + 'm' : h + 'h');
}
// One day of windows in display time: every UTC boundary shifted by the offset and wrapped into
// 0-1440, so the coloured blocks sit under the local hour labels they belong to. Beijing midnight
// (16:00 UTC) is a boundary too, because the weekend rule flips there.
function dcDisplaySegments(){
  const now = new Date(), offset = dcDispOffset();
  const dayStart = dcZone === 'utc'
    ? Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate())
    : Date.UTC(now.getFullYear(), now.getMonth(), now.getDate()) - offset * 60000;
  const bounds = [0, 1440];
  DC_SWITCH_MINUTES.forEach(function(m){ bounds.push(((m + offset) % 1440 + 1440) % 1440); });
  bounds.push(((960 + offset) % 1440 + 1440) % 1440);
  bounds.sort(function(a, b){ return a - b; });
  const raw = [];
  for(let i = 0; i < bounds.length - 1; i++){
    const a = bounds[i], b = bounds[i + 1];
    if(b <= a) continue;
    raw.push({ start:a, end:b, kind:dcKindAt(new Date(dayStart + (a + 0.5) * 60000)) });
  }
  const merged = [];
  raw.forEach(function(seg){
    const last = merged[merged.length - 1];
    if(last && last.kind === seg.kind) last.end = seg.end;
    else merged.push({ start:seg.start, end:seg.end, kind:seg.kind });
  });
  return merged;
}
function dcRenderTrack(track){
  if(!track) return;
  track.innerHTML = '';
  dcDisplaySegments().forEach(function(seg){
    const el = document.createElement('span');
    el.className = 'dc-seg ' + seg.kind;
    el.style.width = ((seg.end - seg.start) / 1440 * 100).toFixed(4) + '%';
    track.appendChild(el);
  });
}
function dcMoney(v){ return '$' + v.toFixed(2); }
function dcRatesHtml(){
  const rows = DC_RATES.map(function(m){
    return '<div class="dc-rate"><span class="dc-rate-name">' + esc(m.name) + '</span>'
      + '<span class="dc-rate-cell"><i>in</i><b class="dc-amt" data-off="' + dcMoney(m.off.in)
      + '" data-peak="' + dcMoney(m.off.in * DC_PEAK_MULTIPLIER) + '">' + dcMoney(m.off.in)
      + '</b></span>'
      + '<span class="dc-rate-cell"><i>out</i><b class="dc-amt" data-off="' + dcMoney(m.off.out)
      + '" data-peak="' + dcMoney(m.off.out * DC_PEAK_MULTIPLIER) + '">' + dcMoney(m.off.out)
      + '</b></span></div>';
  }).join('');
  return '<div class="dc-rates off"><div class="dc-rates-head">API rates · '
    + '<span class="dc-rates-kind">off-peak</span></div>' + rows
    + '<div class="dc-rates-note">per 1M tokens · peak is double</div></div>';
}
function dcPaintRates(peak){
  for(const el of document.querySelectorAll('.dc-amt')){
    const v = el.getAttribute(peak ? 'data-peak' : 'data-off');
    if(v !== null) el.textContent = v;
  }
  for(const el of document.querySelectorAll('.dc-rates')){
    el.classList.toggle('peak', peak);
    el.classList.toggle('off', !peak);
    const k = el.querySelector('.dc-rates-kind');
    if(k) k.textContent = peak ? 'peak' : 'off-peak';
  }
}
function dcRender(){
  if(!dcBuilt || !dcEnabled) return;
  const now = new Date();
  const win = dcUtcWindow(now);
  const peak = win.kind === 'peak';
  const crossDay = dcDayKey(win.end) !== dcDayKey(now);
  const left = dcClock((win.end.getTime() - now.getTime()) / 1000);

  // The bar's status colour is keyed off #clock-bar itself (.clock.off/.clock.peak); #clock is
  // the head button inside it.
  const bar = document.getElementById('clock-bar');
  bar.classList.toggle('peak', peak);
  bar.classList.toggle('off', !peak);
  document.getElementById('clock-kind').textContent = peak ? 'Peak prices' : 'Off-peak · half price';
  document.getElementById('clock-count').textContent = left;
  document.getElementById('clock-meta').textContent = 'left · ' + (peak ? 'off-peak' : 'peak')
    + ' at ' + (crossDay ? dcFmtDay.format(win.end) : dcFmtTime.format(win.end));

  const hero = document.getElementById('clock-hero');
  hero.className = 'dc-hero ' + win.kind;
  document.getElementById('clock-badge').textContent = peak ? 'Peak pricing' : 'Off-peak · half price';
  document.getElementById('clock-big').textContent = left;
  document.getElementById('clock-until').textContent = (peak ? 'Off-peak starts ' : 'Peak starts ')
    + (crossDay ? dcFmtDayZone.format(win.end) : dcFmtTimeZone.format(win.end));

  document.getElementById('clock-zone-label').textContent = dcZone === 'utc' ? 'UTC' : 'your time';
  const todayKey = dcDayKey(now);
  const daynote = document.getElementById('clock-daynote');
  daynote.hidden = !dcOffPeakAllDay(now);
  if(!daynote.hidden)
    daynote.textContent = (dcIsHoliday(now) ? 'Chinese public holiday' : 'Weekend')
      + ' · off-peak all day';
  dcWindowList(now, dcRows.length).forEach(function(item, i){
    const row = dcRows[i];
    row.tr.className = 'dc-wrow ' + item.kind + (item.current ? ' cur' : '');
    row.kind.textContent = item.kind === 'peak' ? 'Peak' : 'Off-peak';
    row.range.textContent = dcRangeLabel(item.start, item.end, todayKey);
    row.meta.textContent = item.current
      ? 'now · ' + dcAway(item.end.getTime() - now.getTime()) + ' left'
      : dcDuration(item.end.getTime() - item.start.getTime());
  });

  dcRenderTrack(document.getElementById('clock-track'));
  dcRenderTrack(document.getElementById('clock-mini'));
  const pct = dcMarkerPct(now);
  document.getElementById('clock-now').style.left = pct + '%';
  document.getElementById('clock-mini-now').style.left = pct + '%';
  document.getElementById('clock-tz').textContent = dcZone === 'utc'
    ? 'UTC' : dcTzName() + ' · ' + dcOffsetLabel();

  dcPaintRates(peak);

  // The switch itself: one desktop notification per flip, fired once. The first tick only
  // records the state, so opening the page mid-window never announces a change that did not happen.
  if(dcLastKind === null) dcLastKind = win.kind;
  else if(dcLastKind !== win.kind){
    dcLastKind = win.kind;
    dcFireSwitch(win.kind, win.end);
  }
}
function dcFireSwitch(kind, end){
  if(!dcNotify || !('Notification' in window) || Notification.permission !== 'granted') return;
  const peak = kind === 'peak';
  const crossDay = dcDayKey(end) !== dcDayKey(new Date());
  const until = crossDay ? dcFmtDayZone.format(end) : dcFmtTimeZone.format(end);
  const body = peak
    ? 'DeepSeek peak rates now apply (double) until ' + until + '.'
    : 'DeepSeek off-peak rates now apply (half price) until ' + until + '.';
  try{
    new Notification('DeepSeek pricing: ' + (peak ? 'Peak' : 'Off-peak'),
                     { body:body, tag:'quota-panel-deepseek' });
  }catch(e){}
}
function dcSetHint(text){
  const el = document.getElementById('clock-hint');
  if(el){ el.textContent = text || ''; el.hidden = !text; }
}
function dcApplyOpen(){
  const open = dcOpen && dcEnabled;
  document.getElementById('clock-panel').hidden = !open;
  const state = open ? 'true' : 'false';
  document.getElementById('clock').setAttribute('aria-expanded', state);
  document.getElementById('clock-chev').setAttribute('aria-expanded', state);
  document.getElementById('clock-bar').classList.toggle('dc-open', open);
}
function dcApplyZone(){
  for(const btn of document.querySelectorAll('#clock-panel .dc-toggle button')){
    const on = (btn.getAttribute('data-zone') === 'utc') === (dcZone === 'utc');
    btn.classList.toggle('on', on);
    btn.setAttribute('aria-pressed', on ? 'true' : 'false');
  }
}
function dcClose(){ dcOpen = false; dcApplyOpen(); }
function dcOnNotifyChange(){
  const el = document.getElementById('clock-notify');
  if(!el.checked){ dcNotify = false; dcSetHint(''); dcSaveSettings(); return; }
  if(!('Notification' in window)){ el.checked = false; dcSetHint('no desktop notifications'); return; }
  if(Notification.permission === 'granted'){ dcNotify = true; dcSetHint(''); dcSaveSettings(); return; }
  if(Notification.permission === 'denied'){ el.checked = false; dcSetHint('blocked by the browser'); return; }
  Notification.requestPermission().then(function(p){
    const granted = p === 'granted';
    el.checked = granted;
    dcNotify = granted;
    dcSetHint(granted ? '' : 'not allowed');
    dcSaveSettings();
  });
}
// Reconcile a remembered "on" with the browser's actual permission, so the switch never reads
// enabled while nothing can fire: uncheck and say why when it is blocked or still unanswered.
function dcSyncNotify(){
  const el = document.getElementById('clock-notify');
  if(!dcNotify){ el.checked = false; return; }
  if(!('Notification' in window)){
    dcNotify = false; el.checked = false;
    dcSetHint('no desktop notifications'); dcSaveSettings(); return;
  }
  if(Notification.permission === 'granted'){ el.checked = true; return; }
  dcNotify = false; el.checked = false;
  dcSetHint(Notification.permission === 'denied'
    ? 'blocked by the browser'
    : 'allow notifications first');
  dcSaveSettings();
}
// The reader's own settings, restored like the history page's: validated, and any bad value
// falls back to the default rather than poisoning the control.
function dcLoadSettings(){
  try{
    const saved = JSON.parse(localStorage.getItem(DC_KEY) || 'null');
    if(saved && typeof saved === 'object'){
      if(saved.zone === 'local' || saved.zone === 'utc') dcZone = saved.zone;
      dcNotify = saved.notify === true;
      dcOpen = saved.open === true;
    }
  }catch(e){}
}
function dcSaveSettings(){
  try{
    localStorage.setItem(DC_KEY, JSON.stringify({ v:1, zone:dcZone, notify:dcNotify, open:dcOpen }));
  }catch(e){}
}
function dcInit(){
  if(dcBuilt) return;
  dcBuilt = true;
  dcLoadSettings();
  dcBuildFormatters();
  const body = document.getElementById('clock-windows-body');
  for(let i = 0; i < DC_SWITCH_MINUTES.length; i++){
    const tr = document.createElement('div');
    const kind = document.createElement('span'); kind.className = 'dc-wkind';
    const range = document.createElement('span'); range.className = 'dc-wrange';
    const meta = document.createElement('span'); meta.className = 'dc-wmeta';
    tr.appendChild(kind); tr.appendChild(range); tr.appendChild(meta);
    body.appendChild(tr);
    dcRows.push({ tr:tr, kind:kind, range:range, meta:meta });
  }
  function dcToggleOpen(){
    dcOpen = !dcOpen; dcApplyOpen(); dcSaveSettings();
  }
  document.getElementById('clock').addEventListener('click', dcToggleOpen);
  document.getElementById('clock-chev').addEventListener('click', dcToggleOpen);
  // Unwrapped, the whole tile is one control: a click anywhere on the panel that is NOT on a
  // control inside it wraps it back, not just the bar. Buttons, inputs and links inside keep
  // their own job (the Local/UTC toggle must switch timezone, not close the panel).
  document.getElementById('clock-panel').addEventListener('click', function(e){
    if(e.target.closest('button, input, label, a, select')) return;
    dcToggleOpen();
  });
  document.addEventListener('keydown', function(e){
    if(e.key === 'Escape' && dcOpen){ dcClose(); dcSaveSettings(); }
  });
  for(const btn of document.querySelectorAll('#clock-panel .dc-toggle button')){
    btn.addEventListener('click', function(){
      dcZone = btn.getAttribute('data-zone') === 'utc' ? 'utc' : 'local';
      dcBuildFormatters(); dcApplyZone(); dcSaveSettings();
    });
  }
  const notify = document.getElementById('clock-notify');
  notify.addEventListener('change', dcOnNotifyChange);
  dcSyncNotify();
  dcApplyOpen();
  dcApplyZone();
}

// load() schedules the next fetch itself, whichever way it ends.
dcInit();
load();
setInterval(tick, TICK_MS);
</script>
