# quota-panel — example compose file.
#
# This is the generic, self-contained version: it publishes the port on loopback
# and hardens the container. Put a reverse proxy with authentication in front of
# it (see "Security" in the README) rather than exposing it directly.
#
#   docker compose up -d
#   open http://localhost:8080
#
# Copy ../accounts.example.json to ./accounts.json first. Usage history keeps its store in
# the named volume below — a volume or directory, never a single file, because sqlite writes
# its journal beside the database.

services:
  quota-panel:
    image: ghcr.io/realabitbol/quota-panel:latest
    container_name: quota-panel
    restart: unless-stopped

    # Loopback only — a reverse proxy (or an SSH tunnel) is the intended entry point.
    ports:
      - "127.0.0.1:8080:8080"

    volumes:
      - ./accounts.json:/config/accounts.json:ro
      # Usage history's store. Keep it a directory: sqlite needs its journal beside the
      # database, and a CIFS/NFS path is refused outright.
      - quota-history:/data

    environment:
      QUOTA_POLL_SECONDS: "60"
      # TZ: Europe/Paris            # only affects nothing today: all timestamps are UTC

    # Runtime hardening: nothing here is needed by a read-only dashboard.
    read_only: true
    tmpfs:
      # Two copies of the largest artwork fetch (8 MiB read, then the re-encoded WebP) must
      # fit, or the shrink fails on a container that is otherwise healthy.
      - "/tmp:rw,size=32m,noexec,nosuid,nodev"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Measured, not guessed: a 6000x4000 JPEG shrunk to 3240x2160 WebP peaks at 323-346 MB
    # RSS, because Pillow decodes the whole bitmap before it resizes. 128m was ~2.7x below
    # the peak of the feature the README advertises, so the container was OOM-killed and
    # restarted on a large wallpaper.
    mem_limit: 512m

    # The panel is a long-lived reader: an old log line is worth less than the disk it
    # occupies, and a crash-loop would otherwise fill the volume.
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

    healthcheck:
      # Mirrors the image's HEALTHCHECK; compose wins when both are present. Keep the two strings
      # identical when either changes. No `.status==200` test: urlopen returns only for 2xx and
      # raises otherwise, so that branch could never run.
      test: ["CMD", "python3", "-c", "import os,urllib.request,sys\nport=os.environ.get('PORT','8080')\ntry:\n    urllib.request.urlopen('http://127.0.0.1:'+port+'/api/health', timeout=4)\n    sys.exit(0)\nexcept Exception:\n    sys.exit(1)"]
      interval: 60s
      timeout: 5s
      retries: 3
      # 60s, not 20s: /api/health answers 503 until the first refresh_all finishes, and that first
      # poll runs sequentially over every account at up to QUOTA_HTTP_TIMEOUT each.
      start_period: 60s

# History's store; mounted above. Docker initialises it from the image's own /data, which the
# image ships owned by uid 10001, so the service user can write to it as it stands.
volumes:
  quota-history:
